<body>

<div id="tune">
  <label>soften ramp tau (s) <span id="v_up"></span></label><input type="range" id="s_up" min="0.5" max="5" step="0.1">

  <label>animals at once (max) <span id="v_maxa"></span></label><input type="range" id="s_maxa" min="1" max="5" step="1">
  <label>animal strength <span id="v_str"></span></label><input type="range" id="s_str" min="0.1" max="1" step="0.02">
  <label>cloud texture <span id="v_tex"></span></label><input type="range" id="s_tex" min="0" max="2" step="0.05">
  <label>soft blur (scene u) <span id="v_blur"></span></label><input type="range" id="s_blur" min="3" max="20" step="0.5">

<script>
'use strict';
/* ============================================================
   SOFTEN — seeing at low spatial frequency. The squint family.

   Hybrid images (Oliva & Schyns), pointillism, the designer's
   squint test: some things exist only at low spatial frequency,
   and sharp attention to detail is exactly what hides them.
   Here the verb is DEFOCUS, not aversion — a held, patient act,
   like letting the eyelids droop. Press and hold, and the scene
   runs together; scan hard and it stays a list of objects.

   The valley holds still; the sky does not. Wind carries clouds
   across it all evening, and some of them are animals — a whale,
   a rabbit, an elephant, a dragon — each one a low-frequency
   shape inside an ordinary billowy cloud. In sharp view they are
   cloud texture; soften, and whoever is passing right now shows.
   They come and go on the wind whether or not anyone looks, so
   a soft gaze keeps meeting someone new, and a hard one never
   misses anything it was owed.

   Two honesties anchor it. Scotopic vision is genuinely
   low-acuity, so as night falls the world softens itself for
   everyone — what the player practiced is what the dark does
   anyway. And a found figure stays found: once you have seen
   the face in the hillside you cannot unsee it, which is true
   of real hybrid images, so recognition is the one thing that
   survives sharpening. A cloud found stays seen until the wind
   takes it out of the valley.

   Nothing is scored, counted, or listed. Dusk deepens, birds
   cross, the moon rises whether or not you attend.
   ============================================================ */

const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const QS = new URLSearchParams(location.search);

const P = {
  tauUp:     1.9,    // s: softness arrives slowly — eyelids drooping, not a toggle
  tauDown:   0.4,    // s: and sharpness snaps back, because opening your eyes is fast
  strainMax: 220,    // px/s smoothed gaze speed: hunting while holding breaks the squint
  settleT:   2.8,    // s a figure must be held in soft view to settle
  softSee:   0.55,   // softness above which figures can settle
  nightFloor:0.55,   // how soft the world becomes on its own at full night
  duskT:     230,    // s to full night
  duration:  300,    // s: past this, the dark reveals whatever in the land was never found

  // ── the drifting sky ──
  wind:       36,    // scene units/s for a cloud at depth 1 (~70 s to cross a desktop sky)
  gust:       0.28,  // fractional slow variation in the wind (two incommensurate sines)
  animalGap:  12,    // s mean gap between animal arrivals (jittered ±40%)
  decoyGap:   10,    // s mean gap between plain clouds
  maxAnimals: 4,     // animal clouds in the sky at once
  maxDecoys:  3,     // plain clouds in the sky at once
  zMin: 0.72, zMax: 1.18, // depth: far clouds are smaller, slower and lower
  cloudBottom: 585,  // scene y an animal's belly stays above (the ridge line is ~600–700)
  clearX: 40,        // scene units of sky kept between two clouds sharing a band
  narrowBoost: 0.7,  // how much bigger clouds get on narrow (portrait) views
  // the hiding: how strong the low-frequency animal is in the sharp pixels,
  // and how much high-frequency cloud texture is laid across it
  plateRes:   44,    // plate pixels per 100 design units — THE low-pass on the animal itself
  plateBlur:  1,     // extra [1,2,1] smoothing passes on the plate's edge
  animalStr:  0.36,  // alpha of the animal mass in the sharp sprite
  decoyCore:  0.8,   // plain clouds' cores, relative to animalStr (so cores aren't a tell)
  bodyAlpha:  0.24,  // the faint fill of the cumulus envelope the animal lives inside
  bodyTone:   [58, 46, 82],    // its colour; darker than the sky cancels the texture's lit tops
  envelope:   0.12,  // how far (in animal widths) the envelope dilates past the animal
  texture:    1.5,   // multiplier on lobe/rim/crevice/grain density
  texContrast: 1.4,  // multiplier on every texture element's alpha — the HF mask's strength
  shade:      1.3,   // weight of the lobes' shaded undersides (balances their lit tops)
  blurScene:  10.5,    // soft view: first downsample step in SCENE units (x2 overall), so
                     // what survives softening is the same on a phone as on a monitor
};

// ── canvas ──────────────────────────────────────────────────────────────────
const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

// The valley is authored in fixed scene units and cover-fitted, so a resize
// never moves a figure out from under a settling gaze.
const SC_W = 2000, SC_H = 1250;
let sk = 1, offX = 0, offY = 0;
function sx(x){ return x * sk + offX; }
function sy(y){ return y * sk + offY; }
function visBounds(){ return { xL: -offX / sk, xR: (W - offX) / sk, yT: -offY / sk }; }

// Layers. The sky gradient and the land are static bakes; clouds are
// sprites that move between them (behind the ridges). Every frame the SHARP
// composite is drawn, and the soft view is a blur OF THAT FRAME — computed
// live by a two-step downsample, so the rule still holds with things moving:
// softening only ever removes detail from pixels already on screen, it never
// adds an overlay.
const skyC  = document.createElement('canvas'); const kctx = skyC.getContext('2d');
const landC = document.createElement('canvas'); const lctx = landC.getContext('2d');
const blurA = document.createElement('canvas'); const bactx = blurA.getContext('2d');
const blurB = document.createElement('canvas'); const bbctx = blurB.getContext('2d');

let vignetteGrad = null;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 1.75);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // Cover-fit, but never crop the visible slice below ~1250 scene units of
  // width: a straight cover on a portrait phone showed 29% of the valley and
  // put nearly every figure off-screen. When the cap letterboxes the scene
  // vertically, the bake extends sky above and meadow below, and the horizon
  // is pinned at 58% of the screen height.
  const cover = Math.max(W / SC_W, H / SC_H);
  sk = Math.max(W / SC_W, Math.min(cover, W / 1250));
  offX = (W - SC_W * sk) / 2;
  offY = SC_H * sk < H ? H * 0.58 - 830 * sk : (H - SC_H * sk) / 2;

  buildScene();
  for (const cl of CLOUDS) bakeCloud(cl);

  vignetteGrad = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.42, W/2, H/2, Math.max(W,H)*0.80);
  vignetteGrad.addColorStop(0, 'rgba(10,8,16,0)');
  vignetteGrad.addColorStop(1, 'rgba(10,8,16,0.45)');

  DBG.resizes++;
}

// ── the land figures ────────────────────────────────────────────────────────
// Each is a cluster of soft masses that IS part of the landscape: the ridge
// is the giant, the hedgerow is the hare. In the sharp bake the same masses
// are present but broken — detail drawn across their boundaries so the eye
// parses trees and leaves, not the gestalt. Blurred, the detail is gone and
// the shape assembles. `night` marks the one figure that exists only in stars.
// (The sky's figures are not listed here: they arrive on the wind — below.)
const FIGS = [
  { key: 'giant', name: 'the sleeping giant', cx: 1430, cy: 700, r: 300, found: false, prog: 0, revealed: 0 },
  { key: 'hare',  name: 'the hare',           cx: 545,  cy: 690, r: 190, found: false, prog: 0, revealed: 0 },
  { key: 'fox',   name: 'the fox',            cx: 1360, cy: 1030, r: 210, found: false, prog: 0, revealed: 0 },
  { key: 'heron', name: 'the heron',          cx: 980,  cy: 205, r: 230, found: false, prog: 0, revealed: 0, night: true },
];

// Deterministic scatter for detail passes — the valley must not reshuffle on
// resize, or it reads as a different place.
let seed = 20260815;
function srnd(a, b){
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return a + (seed / 4294967296) * (b - a);
}
// Independent seeded streams for the sky (one per cloud, one for the weather)
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const SKY_SEED = (parseInt(QS.get('seed'), 10) || ((Math.random() * 2147483647) | 0)) >>> 0;
const wr = mulberry32(SKY_SEED);          // the weather: what comes, when, where
const wrand = (a, b) => a + wr() * (b - a);

// ── the sky's animals ───────────────────────────────────────────────────────
// Authored as chunky parametric silhouettes — ellipses, polygons and tapered
// limbs in a 100-unit-wide design box, facing the way the wind blows. They
// are rasterised crisp and then DOWNSAMPLED to a plate a few dozen pixels
// wide: that downsample is what guarantees each animal is low-frequency only
// (a leg too thin to survive the plate would not survive the soft gaze
// either, so it is not drawn at all). Plates are smoothly upscaled into the
// clouds, exactly as an imported image is (see plateFromImage).
const SHP = {
  e(c, x, y, rx, ry, rot = 0){ c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, 6.2832); c.fill(); },
  p(c, pts){ c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.closePath(); c.fill(); },
  // a tapered limb along a polyline: stamped discs, width w0 → w1
  l(c, pts, w0, w1 = w0){
    const seg = []; let total = 0;
    for (let i = 1; i < pts.length; i++){ const d = Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]); seg.push(d); total += d; }
    const n = Math.max(2, Math.ceil(total / 0.4));
    let si = 0, acc = 0;
    for (let k = 0; k <= n; k++){
      const s = total * k / n;
      while (si < seg.length - 1 && acc + seg[si] < s){ acc += seg[si]; si++; }
      const f = seg[si] > 0 ? (s - acc) / seg[si] : 0;
      const a = pts[si], b = pts[si + 1];
      const x = a[0] + (b[0] - a[0]) * f, y = a[1] + (b[1] - a[1]) * f;
      const r = (w0 + (w1 - w0) * (s / total)) / 2;
      c.beginPath(); c.arc(x, y, r, 0, 6.2832); c.fill();
    }
  },
  // let the sky through (eyes, the turtle's flat underside)
  cut(c, fn, a = 1){ c.save(); c.globalCompositeOperation = 'destination-out'; c.globalAlpha = a; fn(); c.restore(); },
};
const { e: E, p: PG, l: LB } = SHP;

// w: width in scene units at depth 1. h: design-box height (width is 100).
const SPECIES = [
  { key: 'whale', name: 'a whale', w: 540, h: 48, draw(c){

      E(c, 76, 25, 21, 15);
      LB(c, [[22, 29], [10, 22], [6, 13]], 14, 5);

  { key: 'rabbit', name: 'a rabbit', w: 330, h: 80, draw(c){

      LB(c, [[59, 33], [54, 17], [51, 3]], 8, 5);

  { key: 'elephant', name: 'an elephant', w: 470, h: 72, draw(c){

      E(c, 76, 26, 14, 14);

      LB(c, [[86, 30], [92, 44], [91, 58], [97, 64]], 9, 4);
      LB(c, [[22, 44], [22, 69]], 11, 10); LB(c, [[33, 46], [33, 69]], 9, 8);
      LB(c, [[58, 46], [58, 69]], 9, 8); LB(c, [[68, 44], [69, 69]], 11, 10);

  { key: 'fish', name: 'a fish', w: 400, h: 52, draw(c){
      E(c, 56, 26, 31, 17);
      PG(c, [[32, 26], [5, 7], [12, 26], [5, 45]]);
      PG(c, [[45, 11], [57, 0], [69, 12]]);
      PG(c, [[53, 40], [60, 51], [67, 39]]);
  }},
  { key: 'bird', name: 'a bird', w: 420, h: 60, draw(c){

      PG(c, [[79, 37], [90, 41], [79, 44]]);
      PG(c, [[31, 42], [13, 35], [15, 52], [31, 47]]);

      PG(c, [[85, 13], [99, 21], [85, 26]]);
      PG(c, [[72, 14], [73, -1], [81, 10]]); PG(c, [[80, 11], [86, -2], [89, 12]]);

];

// Plate tone: every animal is cloud-white mass, authored or imported.
const LIGHT = [238, 228, 232];

// alpha grid + interior points, for laying texture over the cloud later
function finishPlate(tiny, pw, ph, aspect){
  let alpha = null; const inner = [];
  try {
    const d = tiny.getContext('2d').getImageData(0, 0, tiny.width, tiny.height).data;
    alpha = new Float32Array(tiny.width * tiny.height);
    for (let i = 0; i < alpha.length; i++){
      alpha[i] = d[i * 4 + 3] / 255;
      if (alpha[i] > 0.55) inner.push([((i % tiny.width) + 0.5) / tiny.width, (((i / tiny.width) | 0) + 0.5) / tiny.height]);
    }
  } catch (_) { alpha = null; }
  return { c: tiny, tw: tiny.width, th: tiny.height, pw, ph, aspect, alpha, inner };
}

function plateFromSilhouette(draw, h){
  const M = 10;                                 // design-unit margin round the box
  const bw = 100 + 2 * M, bh = h + 2 * M, RS = 2;
  const big = document.createElement('canvas');
  big.width = Math.round(bw * RS); big.height = Math.round(bh * RS);
  const b = big.getContext('2d');
  b.setTransform(RS, 0, 0, RS, M * RS, M * RS);
  b.fillStyle = '#fff'; b.strokeStyle = '#fff';
  draw(b);
  // two-step reduction so the plate is a true area average, not a point sample
  const tw = Math.max(4, Math.round(bw * P.plateRes / 100)), th = Math.max(4, Math.round(bh * P.plateRes / 100));
  const mid = document.createElement('canvas'); mid.width = tw * 3; mid.height = th * 3;
  const m = mid.getContext('2d'); m.imageSmoothingEnabled = true; m.imageSmoothingQuality = 'high';
  m.drawImage(big, 0, 0, mid.width, mid.height);
  const tiny = document.createElement('canvas'); tiny.width = tw; tiny.height = th;
  const t = tiny.getContext('2d'); t.imageSmoothingEnabled = true; t.imageSmoothingQuality = 'high';
  t.drawImage(mid, 0, 0, tw, th);
  try {
    const id = t.getImageData(0, 0, tw, th), d = id.data;
    // soften the plate's own edge a little further ([1,2,1] passes on alpha),
    // so even the sharp view never shows the animal as a clean outline
    let a = new Float32Array(tw * th);
    for (let i = 0; i < a.length; i++) a[i] = d[i * 4 + 3];
    for (let pass = 0; pass < P.plateBlur; pass++){
      const b2 = new Float32Array(a.length);
      for (let y = 0; y < th; y++) for (let x = 0; x < tw; x++){
        const i = y * tw + x;
        b2[i] = (2 * a[i] + (x > 0 ? a[i - 1] : 0) + (x < tw - 1 ? a[i + 1] : 0)) / 4;
      }
      for (let y = 0; y < th; y++) for (let x = 0; x < tw; x++){
        const i = y * tw + x;
        a[i] = (2 * b2[i] + (y > 0 ? b2[i - tw] : 0) + (y < th - 1 ? b2[i + tw] : 0)) / 4;
      }
    }
    for (let i = 0; i < a.length; i++){ d[i * 4] = LIGHT[0]; d[i * 4 + 1] = LIGHT[1]; d[i * 4 + 2] = LIGHT[2]; d[i * 4 + 3] = Math.round(a[i]); }
    t.putImageData(id, 0, 0);
  } catch (_) { /* never tainted: drawn here */ }
  return finishPlate(tiny, bw / 100, bh / 100, h / 100);
}

// ── an imported low-frequency figure ────────────────────────────────────────
// Any image from anywhere — an AI generator, a photo, a sketch — can become a
// hidden figure: downsampled to a few dozen pixels it IS a low-frequency
// image (its high frequencies are gone by construction). It joins the sky's
// procession as one more cloud animal, baked into the SHARP cloud before any
// blur, so the honesty property holds: softening reveals it, never adds it.
// Dev mode: drag-and-drop an image onto the page. Script: __soften.embedImage(src, opts).
function plateFromImage(img, opts = {}){
  const tiny = document.createElement('canvas');
  const tw = 48, th = Math.max(8, Math.round(tw * (img.height / img.width)));
  tiny.width = tw; tiny.height = th;
  const tc = tiny.getContext('2d');
  tc.imageSmoothingEnabled = true; tc.imageSmoothingQuality = 'high';
  tc.drawImage(img, 0, 0, tw, th);

  // Translate the image into the sky's own language. Imprinting raw
  // luminance carried the image's BACKGROUND too — a uniform pale frame that
  // read as a rectangular slab in the sky. So: estimate the background as the
  // mean border luminance, then keep only DEVIATION from it — transparent
  // where the image matches its own ground, dark mass where darker, light
  // mass where lighter. Any picture on a plain ground becomes a figure and
  // nothing else.
  try {
    const id = tc.getImageData(0, 0, tw, th);
    const d = id.data;
    const lum = i => (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255;
    let sum = 0, n = 0;
    for (let x = 0; x < tw; x++){ sum += lum(4 * x) + lum(4 * ((th - 1) * tw + x)); n += 2; }
    for (let y = 0; y < th; y++){ sum += lum(4 * y * tw) + lum(4 * (y * tw + tw - 1)); n += 2; }
    const bg = sum / n;
    // In the sky every deviation becomes cloud: a figure darker than its
    // ground and one lighter than it both read as mass (two tones inside one
    // cloud muddied the silhouette once it sat in the texture).
    const DK = opts.dark ?? LIGHT, LT = opts.light ?? LIGHT;
    for (let i = 0; i < d.length; i += 4){
      const dev = lum(i) - bg;
      const k = Math.min(1, Math.abs(dev) / 0.3);
      const col = dev < 0 ? DK : LT;
      d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2];
      d[i + 3] = Math.round(d[i + 3] * (k * k * (3 - 2 * k)));
    }
    tc.putImageData(id, 0, 0);
  } catch (_) { /* tainted canvas (cross-origin without CORS): keep raw pixels */ }

  // and feather the edges regardless, so nothing hints at the frame
  const fx = tc.createLinearGradient(0, 0, tw, 0);
  const fy = tc.createLinearGradient(0, 0, 0, th);
  for (const g of [fx, fy]){
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(0.1, 'rgba(0,0,0,0)');
    g.addColorStop(0.9, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,1)');
  }
  tc.globalCompositeOperation = 'destination-out';
  tc.fillStyle = fx; tc.fillRect(0, 0, tw, th);
  tc.fillStyle = fy; tc.fillRect(0, 0, tw, th);
  tc.globalCompositeOperation = 'source-over';
  const asp = th / tw;
  return finishPlate(tiny, 1, asp, asp * 0.8);
}

function buildPlates(){
  for (const sp of SPECIES) if (sp.draw) sp.plate = plateFromSilhouette(c => sp.draw(c), sp.h);
}

// A plain cloud's core: a few random lobes through the same plate pipeline,
// so plain clouds and animal clouds are made of identical stuff and the
// sharp view carries no tell for which is which.
function decoyPlate(s){
  const r = mulberry32(s ^ 0x5bd1e995);
  const h = 30 + r() * 26;
  const lobes = [];
  const n = 3 + ((r() * 4) | 0);
  for (let i = 0; i < n; i++) lobes.push([12 + r() * 76, h * 0.25 + r() * h * 0.55, 11 + r() * 20, 7 + r() * 11, (r() - 0.5) * 0.7]);
  return plateFromSilhouette(c => { for (const L of lobes) E(c, L[0], L[1], L[2], L[3], L[4]); }, h);
}

// ── clouds ──────────────────────────────────────────────────────────────────
const CLOUDS = [];
let cloudSeq = 0;

// normalised geometry (units of the cloud's design width w): the lumpy
// cumulus body the core sits in — partly over the animal, partly spilling
// past it, so the cloud's own outline is never the animal's outline
function plateAlphaN(pl, dx, dy){   // silhouette alpha at a normalised offset
  if (!pl.alpha) return 0;
  const u = dx / pl.pw + 0.5, v = dy / pl.ph + 0.5;
  if (u < 0 || u >= 1 || v < 0 || v >= 1) return 0;
  return pl.alpha[((v * pl.th) | 0) * pl.tw + ((u * pl.tw) | 0)];
}
function cloudShape(plate, s, kind){
  const r = mulberry32(s);
  const puffs = [];
  const ha = plate.aspect / 2;
  // The envelope: lumps on a jittered grid over the animal DILATED by
  // P.envelope — so they fill the gaps between legs, ears and tail and spill
  // past its extremities. The envelope is cloud-shaped, and it is THIS
  // outline, lumpy and textured, that a sharp gaze reads as "a cloud"; the
  // animal inside it is carried only by the faint low-frequency core.
  const D = P.envelope * (kind === 'animal' ? 1 : 0.6);
  const near = (x, y) => {
    if (plateAlphaN(plate, x, y) > 0.3) return true;
    for (let k = 0; k < 12; k++){
      const a = k * 0.5236;
      for (const f of [0.5, 1]) if (plateAlphaN(plate, x + Math.cos(a) * D * f, y + Math.sin(a) * D * f) > 0.3) return true;
    }
    return false;
  };
  const G = 0.075;
  for (let gy = -ha - D; gy <= ha + D; gy += G){
    for (let gx = -0.5 - D; gx <= 0.5 + D; gx += G){
      const x = gx + (r() - 0.5) * G * 0.8, y = gy + (r() - 0.5) * G * 0.8;
      if (near(x, y)) puffs.push([x, y, 0.045 + r() * 0.05]);
    }
  }
  let ex = 0.5 + 0.03, ey = ha + 0.03;
  for (const [dx, dy, rad] of puffs){ ex = Math.max(ex, Math.abs(dx) + rad); ey = Math.max(ey, Math.abs(dy) + rad); }
  return { puffs, ex, ey };
}

// what a cloud IS (plate, envelope) is independent of how far away it is, so
// placement attempts at different depths share one of these
function cloudKind(kind, sp){
  const s = (SKY_SEED + (++cloudSeq) * 7919) >>> 0;
  const plate = kind === 'animal' ? sp.plate : decoyPlate(s);
  return { kind, sp, s, plate, shape: cloudShape(plate, s, kind), w0: kind === 'animal' ? sp.w : 300 + mulberry32(s ^ 77)() * 200 };
}
function makeCloud(kind, sp, z, pre){
  const k = pre || cloudKind(kind, sp);
  const s = k.s, plate = k.plate, shape = k.shape;
  // a portrait phone sees only ~1250 units of sky but a lot of it vertically:
  // clouds grow a little there so the animals keep enough pixels to resolve
  const vb = visBounds();
  const boost = clamp(1 + (1700 - (vb.xR - vb.xL)) / 1000 * P.narrowBoost, 1, 1 + 0.45 * P.narrowBoost);
  const w = k.w0 * z * boost;
  return {
    id: ++cloudSeq, kind, sp: sp || null, name: sp ? sp.name : null, plate, shape, seed: s, z, w,
    cx: 0, cy: 0, ex: shape.ex * w + 10, ey: shape.ey * w + 10, r: Math.max(w, w * plate.aspect) * 0.42,
    prog: 0, found: false, sprite: null, baking: null,
  };
}

// The sprite: the SHARP cloud, baked once at the current scale. Body, then the
// animal at full final strength, then high-frequency texture laid UNIFORMLY
// over the whole cloud — never traced along the animal's edge, because detail
// that follows an outline draws the outline.
// A generator, so a cloud arriving from off-screen can be baked a few
// milliseconds per frame while it is still out of view (a big one is ~25 ms
// on a desktop — a visible hitch if done at once); bakeCloud() runs it whole.
function bakeCloud(cl){ const it = bakeSteps(cl); while (!it.next().done); cl.baking = null; }
function bakeSome(budgetMs){
  const t0 = performance.now();
  for (const cl of CLOUDS){
    while (cl.baking){
      if (cl.baking.next().done) cl.baking = null;
      if (performance.now() - t0 > budgetMs) return;
    }
  }
}
function* bakeSteps(cl){
  const q = sk * DPR, w = cl.w, pl = cl.plate;
  const hx = cl.ex, hy = cl.ey;
  const cw = Math.max(2, Math.ceil(2 * hx * q)), ch = Math.max(2, Math.ceil(2 * hy * q));
  const cvs = cl.sprite || document.createElement('canvas');
  cvs.width = cw; cvs.height = ch;
  const c = cvs.getContext('2d');
  c.setTransform(q, 0, 0, q, cw / 2, ch / 2);
  const r = mulberry32(cl.seed + 7);
  const rr = (a, b) => a + r() * (b - a);

  // 1. the cumulus body — lumps with a crisp rim and low contrast. Drawn as
  // one layer (max, not sum) so overlaps don't stack into brighter blobs
  // that would compete with the animal under the blur.
  const bodyC = document.createElement('canvas'); bodyC.width = cw; bodyC.height = ch;
  const bc = bodyC.getContext('2d');
  bc.setTransform(q, 0, 0, q, cw / 2, ch / 2);
  bc.fillStyle = `rgb(${P.bodyTone.join(',')})`;
  for (const [dx, dy, rad] of cl.shape.puffs){
    bc.beginPath(); bc.arc(dx * w, dy * w, rad * w, 0, 6.2832); bc.fill();
  }
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalAlpha = P.bodyAlpha; c.drawImage(bodyC, 0, 0); c.restore();

  // 2. the core — the animal (or a plain lobe), smoothly upscaled from its plate
  c.globalAlpha = clamp(P.animalStr * (cl.kind === 'animal' ? (cl.sp.str || 1) : P.decoyCore), 0, 1);
  c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
  c.drawImage(pl.c, -pl.pw * w / 2, -pl.ph * w / 2, pl.pw * w, pl.ph * w);
  c.globalAlpha = 1;
  cl.sprite = cvs;
  yield;

  // 3. texture — laid UNIFORMLY over the whole envelope (body and animal
  // alike), never traced along the animal's edge, because detail that follows
  // an outline draws the outline. Everything here is smaller than the soft
  // blur, so under softening it averages into the body's plain tone.
  // Sampled only where there is cloud (a scallop over bare sky reads as a
  // floating bracket), from a coarse coverage grid so sampling is O(1).
  const G = 4;                                   // scene units per grid cell
  const gw = Math.ceil(2 * hx / G), gh = Math.ceil(2 * hy / G);
  const mC = document.createElement('canvas'); mC.width = gw; mC.height = gh;
  const mc = mC.getContext('2d', { willReadFrequently: true });
  mc.setTransform(1 / G, 0, 0, 1 / G, hx / G, hy / G);
  mc.fillStyle = '#000';
  for (const [dx, dy, rad] of cl.shape.puffs){ mc.beginPath(); mc.arc(dx * w, dy * w, rad * w, 0, 6.2832); mc.fill(); }
  const md = mc.getImageData(0, 0, gw, gh).data;
  const cells = [], wts = [];
  let area = 0;
  for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++){
    const x = -hx + (i + 0.5) * G, y = -hy + (j + 0.5) * G;
    const wt = md[(j * gw + i) * 4 + 3] > 127 ? 1 : plateAlphaN(pl, x / w, y / w);
    if (wt > 0.02){ cells.push(i, j); wts.push(wt); area += wt; }
  }
  const nCells = wts.length;
  const sample = () => {
    if (!nCells) return null;
    for (let k = 0; k < 8; k++){
      const ci = (r() * nCells) | 0;
      if (r() < wts[ci]) return [-hx + (cells[2 * ci] + r()) * G, -hy + (cells[2 * ci + 1] + r()) * G];
    }
    return null;
  };
  // density per area of cloud, so a big envelope is as busy as a small one
  const dens = P.texture * area * G * G / 10000;
  const K = a => Math.min(1, a * P.texContrast);
  c.lineCap = 'round';

  // cauliflower lobes: a lit cap fading down into a shaded underside — the
  // cumulus grammar, at a scale the blur erases. Lit top and shaded bottom
  // in near balance, so a lobe is contrast without being extra brightness.
  // Pre-rendered stamps (three tone balances), drawn scaled.
  const stamps = [0, 0.5, 1].map(f => {
    const sc = document.createElement('canvas'); sc.width = sc.height = 24;
    const g2 = sc.getContext('2d');
    const gr = g2.createLinearGradient(0, 0, 0, 24);
    gr.addColorStop(0, `rgba(252,238,236,${K(0.16 + 0.14 * f)})`);
    gr.addColorStop(0.45, 'rgba(252,238,236,0)');
    gr.addColorStop(0.6, 'rgba(38,26,58,0)');
    gr.addColorStop(1, `rgba(38,26,58,${K((0.4 + 0.18 * (1 - f)) * P.shade)})`);
    g2.fillStyle = gr; g2.beginPath(); g2.arc(12, 12, 12, 0, 6.2832); g2.fill();
    return sc;
  });
  yield;
  const nL = Math.round(240 * dens);
  for (let i = 0; i < nL; i++){
    if (i % 400 === 399) yield;
    const pt = sample(); if (!pt) continue;
    const R = rr(2.2, 5.5);
    c.drawImage(stamps[(r() * 3) | 0], pt[0] - R, pt[1] - R, 2 * R, 2 * R);
  }
  yield;
  // bright rims along the tops of lobes (batched by strength)
  const nS = Math.round(40 * dens);
  for (let b = 0; b < 3; b++){
    c.lineWidth = 1 + 0.3 * b;
    c.strokeStyle = `rgba(250,232,228,${K(0.3 + 0.12 * b)})`;
    c.beginPath();
    for (let i = 0; i < nS / 3; i++){
      const pt = sample(); if (!pt) continue;
      const R = rr(3, 7), a0 = Math.PI * rr(1.05, 1.25), a1 = Math.PI * rr(1.75, 1.95);
      c.moveTo(pt[0] + Math.cos(a0) * R, pt[1] + Math.sin(a0) * R);
      c.arc(pt[0], pt[1], R, a0, a1);
    }
    c.stroke();
  }
  yield;
  // shadowed crevices and a few long ridges that cut clean across whatever
  // lies underneath — gestalt breakers, the cloud's own structure
  const nV = Math.round(9 * dens);
  for (let b = 0; b < 2; b++){
    c.lineWidth = 1.3 + 0.7 * b;
    c.strokeStyle = `rgba(44,32,64,${K(0.22 + 0.12 * b)})`;
    c.beginPath();
    for (let i = 0; i < nV / 2; i++){
      const pt = sample(); if (!pt) continue;
      const [x, y] = pt, L = rr(9, 22), a0 = rr(-0.6, 0.6);
      const x2 = x + Math.cos(a0) * L, y2 = y + Math.sin(a0) * L;
      c.moveTo(x, y); c.quadraticCurveTo((x + x2) / 2 + rr(-4, 4), (y + y2) / 2 + rr(2, 5), x2, y2);
    }
    c.stroke();
  }
  const nR = Math.round(0.8 * dens);
  c.lineWidth = 1.8;
  c.strokeStyle = `rgba(244,222,220,${K(0.28)})`;
  c.beginPath();
  for (let i = 0; i < nR; i++){
    const pt = sample(); if (!pt) continue;
    const R = rr(40, 80), a0 = Math.PI * rr(1.2, 1.35), a1 = Math.PI * rr(1.65, 1.8);
    c.moveTo(pt[0] + Math.cos(a0) * R, pt[1] + R + Math.sin(a0) * R);
    c.arc(pt[0], pt[1] + R, R, a0, a1);
  }
  c.stroke();
  // grain, paired light and dark so it averages to nothing under the blur
  const nG = Math.round(280 * dens);
  for (let b = 0; b < 6; b++){
    yield;
    const light = b < 3, lv = b % 3;
    c.fillStyle = light ? `rgba(250,238,238,${K(0.07 + 0.05 * lv)})` : `rgba(20,14,34,${K(0.08 + 0.05 * lv)})`;
    c.beginPath();
    for (let i = 0; i < nG / 6; i++){
      const pt = sample(); if (!pt) continue;
      c.rect(pt[0], pt[1], rr(1.3, 2.8), rr(1.3, 2.8));
    }
    c.fill();
  }
}

// ── the weather: who comes, when, where ─────────────────────────────────────
// Animals come from a shuffled deck, so every one passes before any repeats.
let deck = [], lastSp = null;
function peekSpecies(){
  if (!deck.length){
    deck = SPECIES.filter(s => s.plate);
    for (let i = deck.length - 1; i > 0; i--){ const j = (wr() * (i + 1)) | 0; [deck[i], deck[j]] = [deck[j], deck[i]]; }
    if (deck.length > 1 && deck[deck.length - 1] === lastSp) [deck[0], deck[deck.length - 1]] = [deck[deck.length - 1], deck[0]];
  }
  return deck[deck.length - 1];
}

// Two clouds may share a band of sky only if they will never meet while
// both are in view. Every cloud moves at wind × depth, so in "wind distance"
// u their relative motion is fixed and the check is exact whatever the gusts do.
function laneFree(c, vb){
  for (const o of CLOUDS){
    if (Math.abs(o.cy - c.cy) >= (o.ey + c.ey) * 0.82) continue;
    const U = Math.min((vb.xR + o.ex - o.cx) / o.z, (vb.xR + c.ex - c.cx) / c.z);
    const need = (o.ex + c.ex) * 0.88 + P.clearX;
    for (let u = 0; u <= U + 10; u += 10){
      if (Math.abs((o.cx + o.z * u) - (c.cx + c.z * u)) < need) return false;
    }
  }
  return true;
}

// Depth sets everything at once, as it would under a real cloud deck: far
// clouds are smaller, slower, and sit lower toward the horizon.
function trySpawn(kind, inView, spOverride){
  const vb = visBounds();
  const sp = kind === 'animal' ? (spOverride || peekSpecies()) : null;
  if (kind === 'animal' && !sp) return null;
  const pre = cloudKind(kind, sp);
  for (let tries = 0; tries < 24; tries++){
    const z = wrand(P.zMin, P.zMax);
    const cl = makeCloud(kind, sp, z, pre);
    const bottom = kind === 'animal' ? P.cloudBottom : P.cloudBottom + 30;
    const yLow = bottom - cl.shape.ey * cl.w * 0.8;
    const yHigh = Math.max(vb.yT + cl.ey + 20, -520 + cl.ey);
    const t = clamp((z - P.zMin) / (P.zMax - P.zMin) + wrand(-0.35, 0.35), 0, 1);
    cl.cy = yHigh < yLow ? yLow + (yHigh - yLow) * t : yLow;
    cl.cx = inView ? wrand(vb.xL + cl.ex * 0.6, vb.xR - cl.ex * 0.6) : vb.xL - cl.ex - 40;
    if (!laneFree(cl, vb)) continue;
    if (kind === 'animal' && !spOverride){ deck.pop(); lastSp = sp; }
    // in view (the opening sky) it must exist now; arriving from off-screen
    // it bakes a slice per frame while still out of sight
    if (inView) bakeCloud(cl); else cl.baking = bakeSteps(cl);
    CLOUDS.push(cl);
    CLOUDS.sort((a, b) => a.z - b.z);   // far first, near drawn over
    EV.push({ t: +simT.toFixed(2), e: 'arrive', kind, name: cl.name, z: +z.toFixed(2) });
    return cl;
  }
  return null;
}

let windU = 0, windNow = 0;
let nextAnimalAt = 4, nextDecoyAt = 3;
function windAt(t){
  return P.wind * (REDUCED ? 0.5 : 1) *
    (1 + P.gust * (0.62 * Math.sin(t * 0.047 + 0.8) + 0.38 * Math.sin(t * 0.113 + 2.1)));
}

// the opening sky is not empty: someone is already halfway across
function seedSky(){
  trySpawn('animal', true);
  for (let i = 0; i < 3; i++) trySpawn('decoy', true);
}

// ── the rest of the sky: cirrus and birds ──────────────────────────────────
// Both are high-frequency only — thin streaks, specks — so they belong to the
// sharp view and melt out of the soft one: the hard gaze gets its own sky.
const CIRRUS = [];
(function(){
  const r = mulberry32(4242);
  for (let i = 0; i < 11; i++) CIRRUS.push({ x0: r() * 3200, f: r(), len: 120 + r() * 260, a: 0.05 + r() * 0.09, bend: (r() - 0.5) * 24, k: 0.25 + r() * 0.15 });
})();
let FLOCK = null, nextFlockAt = 22;

function advanceSky(dt){
  bakeSome(4);
  windNow = windAt(simT);
  const du = windNow * dt;
  windU += du;
  const vb = visBounds();
  for (let i = CLOUDS.length - 1; i >= 0; i--){
    const cl = CLOUDS[i];
    cl.cx += du * cl.z;
    if (cl.cx - cl.ex > vb.xR + 30){
      cl.gone = true;
      if (nameShow === cl) nameShow = null;
      CLOUDS.splice(i, 1);
    }
  }
  const nA = CLOUDS.filter(c => c.kind === 'animal').length;
  const nD = CLOUDS.length - nA;
  if (simT >= nextAnimalAt){
    const ok = nA < P.maxAnimals && trySpawn('animal', false);
    nextAnimalAt = simT + (ok ? P.animalGap * wrand(0.6, 1.4) : 2);
  }
  if (simT >= nextDecoyAt){
    const ok = nD < P.maxDecoys && trySpawn('decoy', false);
    nextDecoyAt = simT + (ok ? P.decoyGap * wrand(0.6, 1.4) : 2.5);
  }

  // a flock now and then, faster than the wind, either way across
  if (!FLOCK && simT >= nextFlockAt && nightness < 0.7){
    const dir = wr() < 0.6 ? 1 : -1;
    const n = 4 + ((wr() * 6) | 0);
    const birds = [];
    for (let i = 0; i < n; i++) birds.push({ dx: -dir * (i * wrand(14, 26)), dy: (i % 2 ? 1 : -1) * i * wrand(4, 9), ph: wrand(0, 6.28), rate: wrand(7, 10) });
    FLOCK = { dir, x: dir > 0 ? vb.xL - 40 : vb.xR + 40, y: wrand(Math.max(vb.yT + 60, -300), 470), v: wrand(70, 105), birds };
  }
  if (FLOCK){
    FLOCK.x += FLOCK.dir * FLOCK.v * dt;
    FLOCK.y += Math.sin(simT * 0.4) * 4 * dt;
    for (const b of FLOCK.birds) b.ph += b.rate * dt;
    const tail = FLOCK.x + FLOCK.birds[FLOCK.birds.length - 1].dx;
    if ((FLOCK.dir > 0 && tail > vb.xR + 60) || (FLOCK.dir < 0 && tail < vb.xL - 60)){
      FLOCK = null; nextFlockAt = simT + wrand(35, 75);
    }
  }
}

function drawSkyLife(c){
  const vb = visBounds();
  // cirrus, drifting slower than the cumulus (higher up)
  const span = (vb.xR - vb.xL) + 900;
  const yTop = Math.max(vb.yT + 30, -560), yBot = 380;
  c.lineCap = 'round';
  for (const s of CIRRUS){
    const x = vb.xL - 450 + (((s.x0 + windU * s.k) % span) + span) % span;
    const y = yTop + (yBot - yTop) * s.f;
    c.strokeStyle = `rgba(236,210,214,${s.a})`;
    c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + s.len * 0.5, y + s.bend, x + s.len, y + s.bend * 0.3); c.stroke();
    c.lineWidth = 1;
    c.beginPath(); c.moveTo(x + s.len * 0.15, y + 5); c.quadraticCurveTo(x + s.len * 0.55, y + s.bend + 5, x + s.len * 0.85, y + s.bend * 0.3 + 6); c.stroke();
  }
  if (FLOCK){
    c.strokeStyle = 'rgba(30,24,40,0.8)';
    c.lineWidth = 1.7;
    for (const b of FLOCK.birds){
      const x = FLOCK.x + b.dx, y = FLOCK.y + b.dy;
      const f = REDUCED ? 0.4 : Math.sin(b.ph);
      const s = 6.5, lift = s * (0.15 + 0.55 * f);
      c.beginPath();
      c.moveTo(x - s, y - lift); c.quadraticCurveTo(x - s * 0.45, y - lift * 0.2 - 1.5, x, y);
      c.quadraticCurveTo(x + s * 0.45, y - lift * 0.2 - 1.5, x + s, y - lift);
      c.stroke();
    }
  }
}

// ── scene bake ──────────────────────────────────────────────────────────────
// The ridgeline: a profile. Face across x 1150–1750 (brow, nose, lips, chin),
// chest rolling away to the right edge. Everywhere else, ordinary hills.
function ridgeY(x){
  let y = 810
    + Math.sin(x * 0.004 + 1.2) * 26
    + Math.sin(x * 0.0016 + 4.0) * 40;
  const bump = (cx, w, h) => { const k = (x - cx) / w; if (Math.abs(k) < 1) y -= h * (0.5 + 0.5 * Math.cos(k * Math.PI)); };
  bump(1180, 150, 55);   // brow
  bump(1330, 90, 30);    // eye hollow sits after the brow falls
  bump(1430, 95, 105);   // nose
  bump(1560, 70, 34);    // lips
  bump(1660, 90, 52);    // chin
  bump(1870, 260, 85);   // chest
  return y;
}

function paintSky(c){
  // dusk sky, baked at mid-violet; the per-frame grade carries it gold→night
  const sky = c.createLinearGradient(0, 0, 0, SC_H * 0.75);
  sky.addColorStop(0, '#2c2a4e');
  sky.addColorStop(0.55, '#5c4668');
  sky.addColorStop(1, '#a06a6a');
  c.fillStyle = sky;
  c.fillRect(-3000, -3000, SC_W + 6000, 6000 + SC_H);   // sky continues past the authored frame
}

function paintLand(c){
  // far ridge, plain — depth for the giant to sleep against
  c.fillStyle = '#4a4162';
  c.beginPath(); c.moveTo(-3000, 700);
  for (let x = -3000; x <= SC_W + 3000; x += 12)
    c.lineTo(x, 640 + Math.sin(x * 0.0027 + 0.7) * 42 + Math.sin(x * 0.0009) * 30);
  c.lineTo(SC_W + 3000, SC_H + 3000); c.lineTo(-3000, SC_H + 3000); c.closePath(); c.fill();

  // the near ridge — which is also the giant
  c.fillStyle = '#38314e';
  c.beginPath(); c.moveTo(-3000, ridgeY(-3000));
  for (let x = -3000; x <= SC_W + 3000; x += 8) c.lineTo(x, ridgeY(x));
  c.lineTo(SC_W + 3000, SC_H + 3000); c.lineTo(-3000, SC_H + 3000); c.closePath(); c.fill();

  // meadow below the ridge
  const mg = c.createLinearGradient(0, 830, 0, SC_H);
  mg.addColorStop(0, '#2e3140');
  mg.addColorStop(1, '#20242f');
  c.fillStyle = mg;
  c.beginPath(); c.moveTo(-3000, ridgeY(-3000) + 4);
  for (let x = -3000; x <= SC_W + 3000; x += 8) c.lineTo(x, ridgeY(x) + 4);
  c.lineTo(SC_W + 3000, SC_H + 3000); c.lineTo(-3000, SC_H + 3000); c.closePath(); c.fill();

  // hedgerow — which is also the hare (two ear lumps and an arched back)
  function blob(x, y, rx, ry, col){
    c.fillStyle = col;
    c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, 6.284); c.fill();
  }
  const HG = '#252b33';
  blob(560, 760, 190, 75, HG);                                      // back
  blob(430, 700, 55, 95, HG);                                       // near ear
  blob(520, 680, 45, 105, HG);                                      // far ear
  blob(690, 770, 90, 60, HG);                                       // haunch
  blob(880, 800, 120, 55, HG);                                      // plain hedge, decoy
  blob(140, 790, 110, 60, HG);

  // meadow shadow — which is also the fox, curled, tail swept round
  c.fillStyle = 'rgba(26,28,38,0.85)';
  c.beginPath(); c.ellipse(1360, 1040, 200, 95, -0.18, 0, 6.284); c.fill();
  c.beginPath(); c.ellipse(1490, 990, 80, 48, 0.5, 0, 6.284); c.fill();   // head tucked
  c.beginPath(); c.ellipse(1250, 1105, 130, 42, 0.28, 0, 6.284); c.fill();// tail sweep
  c.beginPath(); c.ellipse(950, 1090, 140, 55, 0.1, 0, 6.284); c.fill();  // decoy shadow
}

// High-frequency detail, drawn ONLY into the sharp bake — and deliberately
// across the figure boundaries, because detail crossing an edge is what
// breaks a gestalt. This is the layer the blur (and the night) removes.
function paintDetail(c){
  seed = 20260815;

  // trees along the near ridge, clustered on the face so the profile reads
  // as "hill with trees" until it doesn't
  for (let i = 0; i < 46; i++){
    const x = srnd(0, SC_W);
    const y = ridgeY(x);
    const h = srnd(26, 60) * (x > 1100 && x < 1750 ? 1.15 : 1);
    const w = h * srnd(0.3, 0.45);
    c.fillStyle = '#232030';
    for (let k = 0; k < 3; k++){
      const top = y - h + (h * 0.3) * k;
      const half = w * (1 - k * 0.25);
      c.beginPath();
      c.moveTo(x, top); c.lineTo(x + half, top + h * 0.45); c.lineTo(x - half, top + h * 0.45);
      c.closePath(); c.fill();
    }
    c.fillRect(x - 1.5, y - h * 0.16, 3, h * 0.2);
  }

  // hedge leaf scribble — dense, and clustered ON the hedge masses so the
  // blobs read as foliage; sparse arcs over bare ground read as doodles
  const HEDGES = [
    [560, 760, 190, 75], [430, 700, 55, 95], [520, 680, 45, 105],
    [690, 770, 90, 60], [880, 800, 120, 55], [140, 790, 110, 60],
  ];
  c.strokeStyle = 'rgba(62,72,66,0.8)';
  c.lineWidth = 2;
  for (let i = 0; i < 340; i++){
    const hg = HEDGES[(srnd(0, HEDGES.length)) | 0];
    const a0 = srnd(0, 6.28), k = Math.sqrt(srnd(0, 1));
    const x = hg[0] + Math.cos(a0) * hg[2] * k;
    const yy = hg[1] + Math.sin(a0) * hg[3] * k;
    const r = srnd(3, 9);
    c.beginPath(); c.arc(x, yy, r, srnd(0, 3), srnd(3.5, 6.2)); c.stroke();
  }
  // a lighter leaf-glint pass along the hedge tops
  c.strokeStyle = 'rgba(104,112,92,0.35)';
  c.lineWidth = 1.6;
  for (let i = 0; i < 90; i++){
    const hg = HEDGES[(srnd(0, HEDGES.length)) | 0];
    const a0 = srnd(3.4, 6.0);
    const x = hg[0] + Math.cos(a0) * hg[2] * srnd(0.5, 0.95);
    const yy = hg[1] + Math.sin(a0) * hg[3] * srnd(0.5, 0.95);
    c.beginPath(); c.arc(x, yy, srnd(2.5, 6), srnd(0, 3), srnd(3.5, 6.2)); c.stroke();
  }

  // meadow grass strokes, rows of them, some crossing the fox
  c.strokeStyle = 'rgba(64,72,74,0.55)';
  c.lineWidth = 1.6;
  for (let i = 0; i < 400; i++){
    const x = srnd(0, SC_W), y = srnd(870, SC_H);
    const h2 = srnd(8, 22) * (y / SC_H);
    c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + srnd(-4, 4), y - h2 * 0.6, x + srnd(-7, 7), y - h2); c.stroke();
  }
  // seed heads
  c.fillStyle = 'rgba(120,116,96,0.5)';
  for (let i = 0; i < 60; i++){
    const x = srnd(0, SC_W), y = srnd(880, SC_H);
    c.beginPath(); c.arc(x, y - srnd(14, 26), srnd(1.5, 3), 0, 6.284); c.fill();
  }

  // fine grain over the whole scene, sky included — the high-frequency mask
  // that lets a full-strength low-frequency figure sit unnoticed in the sharp
  // view (film grain is the classic HF masker in hybrid-image work). It sits
  // still while the clouds move under it, as a lens's would. Paired
  // light/dark speckle averages to nothing under the blur.
  for (let i = 0; i < 5200; i++){
    const x = srnd(0, SC_W), y = srnd(-400, SC_H);
    const light = srnd(0, 1) < 0.5;
    c.fillStyle = light
      ? `rgba(232,222,228,${srnd(0.03, 0.09)})`
      : `rgba(8,8,18,${srnd(0.04, 0.12)})`;
    c.fillRect(x, y, srnd(1.4, 3), srnd(1.4, 3));
  }
}

// The land figures' masses, drawn into the SHARP land bake at full final
// strength (and reused per frame, faintly, for found-figure persistence).
const LAND_MASSES = {
  // the giant: brow shadow, the long line of the face, a settled chest
  giant: [[1215,745,120,55,0.05,true,0.34],[1435,690,70,46,0.1,true,0.30],[1610,760,130,50,0.06,true,0.30],[1865,800,200,70,0.02,true,0.26]],
  // hare: ears joined to the arch of the back
  hare:  [[470,685,70,110,-0.12,true,0.32],[560,755,170,70,0.05,true,0.28]],
  // fox: body and tail one warm curl
  fox:   [[1360,1035,190,85,-0.18,true,0.34],[1255,1100,120,40,0.28,true,0.30]],
};
function paintMass(c, x, y, rx, ry, rot, dark, k){
  const g = c.createRadialGradient(x, y, Math.min(rx, ry) * 0.2, x, y, Math.max(rx, ry));
  const col = dark ? '20,18,30' : '226,204,206';
  g.addColorStop(0, `rgba(${col},${k})`);
  g.addColorStop(1, `rgba(${col},0)`);
  c.fillStyle = g;
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(rx / Math.max(rx, ry), ry / Math.max(rx, ry));
  c.beginPath(); c.arc(0, 0, Math.max(rx, ry), 0, 6.284); c.fill();
  c.restore();
}
function paintFigureEmphasis(c, a){
  for (const key in LAND_MASSES) for (const m of LAND_MASSES[key]) paintMass(c, m[0], m[1], m[2], m[3], m[4], m[5], m[6] * a);
}
function paintFigureMassOne(c, f, a){
  const parts = LAND_MASSES[f.key];
  if (!parts) return;
  for (const m of parts) paintMass(c, m[0], m[1], m[2], m[3], m[4], m[5], 0.3 * a);
}

function buildScene(){
  for (const cvs of [skyC, landC]){ cvs.width = Math.max(1, Math.round(W * DPR)); cvs.height = Math.max(1, Math.round(H * DPR)); }

  kctx.setTransform(DPR * sk, 0, 0, DPR * sk, DPR * offX, DPR * offY);
  paintSky(kctx);
  kctx.setTransform(1, 0, 0, 1, 0, 0);

  // The land figures go into the SHARP bake at full, final strength — they are
  // in the pixels the whole time. A true hybrid image adds nothing on blur —
  // softening only ever REMOVES. So the low-frequency figure hides behind two
  // honest mechanisms instead: gestalt camouflage (its masses ARE ridge,
  // hedge, shadow — parsed as landscape) and high-frequency masking (detail
  // and grain drawn across its boundaries). The clouds do the same in the sky.
  lctx.clearRect(0, 0, landC.width, landC.height);
  lctx.setTransform(DPR * sk, 0, 0, DPR * sk, DPR * offX, DPR * offY);
  paintLand(lctx);
  paintFigureEmphasis(lctx, 0.85);
  paintDetail(lctx);
  lctx.setTransform(1, 0, 0, 1, 0, 0);
}

// ── stars (night only) ──────────────────────────────────────────────────────
// A modest field, plus the heron — the one figure that was never in the land
// at all. It links this valley to Sidelong's sky: the same bird, one night
// over. Its stars are placed on the outline and revealed by the same softness
// as everything else, but only once dark.
const STARS = [];
const HERON = [
  [880, 120], [935, 150], [975, 190], [1000, 240],   // neck curve
  [1030, 270], [1080, 280], [1130, 262],             // body
  [1180, 300], [1205, 340],                          // trailing legs
  [1055, 215], [1105, 190],                          // folded wing
  [852, 132],                                        // beak
];
(function(){
  seed = 99;
  for (let i = 0; i < 210; i++){
    STARS.push({ x: srnd(0, SC_W), y: srnd(-700, 760), r: srnd(0.6, 1.7), tw: srnd(0, 6.28), rate: srnd(0.5, 1.8), heron: false });
  }
  for (const [hx, hy] of HERON){
    STARS.push({ x: hx + srnd(-4, 4), y: hy + srnd(-4, 4), r: 2.1, tw: srnd(0, 6.28), rate: srnd(0.4, 0.9), heron: true });
  }
})();

// ── gaze + softness ─────────────────────────────────────────────────────────
let gx = 0, gy = 0, gTX = 0, gTY = 0;
let holding = false, pointerHere = false;
let rawSpeed = 0, smoothSpeed = 0, lastGx = 0, lastGy = 0;
let soft = 0;                 // the held softness
let S = 0;                    // effective softness (held, minus strain, or the night's own)
let S_PIN = null;             // debug: pin S for deterministic renders
let heldFor = 0;

cv.addEventListener('pointerdown', e => {
  holding = true; pointerHere = true;
  gTX = e.clientX; gTY = e.clientY;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  startAudio();
});
cv.addEventListener('pointermove', e => {
  pointerHere = true;
  gTX = e.clientX; gTY = e.clientY;
});
function release(){ holding = false; }
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('pointerleave', () => { pointerHere = false; holding = false; });

// ── simulation ──────────────────────────────────────────────────────────────
let simT = 0;
let nightness = 0;
let moonUp = 0;
let softSum = 0, heldSum = 0, sampleT = 0;
let nameShow = null, nameAlpha = 0, nameT = 0;
let nextBird = 6;
const EV = [];
const DBG = { frames: 0, resizes: 0, blurs: 0 };
const SEEN = new Set();       // debug/summary only — never shown

function advance(dt){
  simT += dt;

  // gaze eases to the pointer; with no pointer it rests where it was
  const ease = 1 - Math.pow(0.002, dt);
  if (pointerHere){ gx += (gTX - gx) * ease; gy += (gTY - gy) * ease; }
  rawSpeed = Math.hypot(gx - lastGx, gy - lastGy) / Math.max(dt, 1e-4);
  lastGx = gx; lastGy = gy;
  smoothSpeed += (rawSpeed - smoothSpeed) * Math.min(1, dt / 1.0);

  // dusk is not contingent on anything
  nightness = clamp((simT - 60) / P.duskT, 0, 1);
  if (simT > P.duration - 50) moonUp = clamp((simT - (P.duration - 50)) / 60, 0, 1);

  // softness: held softness ramps slowly and collapses under strain; the
  // night contributes its own floor, because scotopic vision is genuinely
  // low-acuity — what the player practices is what the dark does anyway.
  // Strain is measured on raw gaze speed, but a gaze drifting along with a
  // cloud moves at a walking pace (~30 px/s) — well inside the ceiling.
  const strain = clamp(smoothSpeed / P.strainMax, 0, 1);
  const wantSoft = holding ? (1 - strain * 0.8) : 0;
  const tau = wantSoft > soft ? P.tauUp : P.tauDown;
  soft += (wantSoft - soft) * Math.min(1, dt / tau);
  S = Math.max(soft, nightness * P.nightFloor);
  if (S_PIN !== null) S = S_PIN;

  if (holding) heldFor += dt; else heldFor = 0;
  softSum += S * dt; heldSum += (holding ? 1 : 0) * dt; sampleT += dt;

  advanceSky(dt);

  // settling: a figure held in soft view assembles; a found figure stays
  // found (once seen, it cannot be unseen — true of real hybrid images).
  // Sky animals settle the same way, while they pass.
  let gazeFig = null;
  const settle = (f, visible) => {
    const d = Math.hypot(sx(f.cx) - gx, sy(f.cy) - gy);
    const near = d < Math.max(f.r * sk, 90);   // floor: a figure is never smaller than a thumb
    if (near && visible) gazeFig = gazeFig || f;
    if (f.found) return;
    if (near && visible && S > P.softSee){
      f.prog = Math.min(1, f.prog + dt / P.settleT);
      if (f.prog >= 1){
        f.found = true;
        if (f.sp) SEEN.add(f.sp.key);
        EV.push({ t: +simT.toFixed(2), e: 'found', name: f.name });
        settleChord();
      }
    } else {
      f.prog = Math.max(0, f.prog - dt * 0.12);
    }
  };
  for (let i = CLOUDS.length - 1; i >= 0; i--) if (CLOUDS[i].kind === 'animal') settle(CLOUDS[i], true);
  for (const f of FIGS) settle(f, f.night ? nightness > 0.5 : true);

  // the name of what is being seen, softly, once it is a thing to see
  if (gazeFig && gazeFig.found && S > 0.35){
    if (nameShow !== gazeFig) nameT = 0;
    nameShow = gazeFig; nameT += dt;
  } else { nameT = 0; nameShow = S > 0.35 ? nameShow : null; }
  if (nameShow && nameShow.gone) nameShow = null;
  nameAlpha += (((nameShow && nameT > 0.6) ? 1 : 0) - nameAlpha) * Math.min(1, dt / 0.8);

  // past the arc, the dark reveals whatever in the land was never found —
  // staggered, one figure at a time, so the ending is a slow gift rather than
  // a flourish. (The sky needs no such gift: the night's own softness is
  // already showing whoever drifts over.)
  if (simT > P.duration){
    FIGS.forEach((f, i) => {
      if (!f.found && simT > P.duration + 8 * i){
        f.revealed = Math.min(1, f.revealed + dt / 6);
        if (f.revealed >= 1 && !f.revEv){ f.revEv = true; EV.push({ t: +simT.toFixed(2), e: 'night-reveal', name: f.name }); }
      }
    });
  }

  // birds settle to roost through the gold, and go quiet
  nextBird -= dt;
  if (nextBird <= 0){ nextBird = 6 + Math.random() * 10; if (nightness < 0.55) birdCall(); }

  updateAudio(dt);
  sayings();
}

// ── render ──────────────────────────────────────────────────────────────────
let warmGrad = null, warmGradH = 0;

// the soft view: a two-step downsample of the sharp frame just drawn, then
// one smooth upscale back over it at alpha S. Bilinear smoothing does the
// rounding; two steps make it gaussian-ish. Chosen over ctx.filter so it
// behaves identically in every browser and in headless playtests.
function softPass(){
  const k = Math.max(2, P.blurScene * sk * DPR);
  const aw = Math.max(1, Math.round(cv.width / k)), ah = Math.max(1, Math.round(cv.height / k));
  const bw = Math.max(1, Math.round(aw / 2)),       bh = Math.max(1, Math.round(ah / 2));
  if (blurA.width !== aw || blurA.height !== ah){ blurA.width = aw; blurA.height = ah; }
  if (blurB.width !== bw || blurB.height !== bh){ blurB.width = bw; blurB.height = bh; }
  bactx.imageSmoothingEnabled = true; bactx.imageSmoothingQuality = 'high';
  bbctx.imageSmoothingEnabled = true; bbctx.imageSmoothingQuality = 'high';
  bactx.drawImage(cv, 0, 0, aw, ah);
  bbctx.drawImage(blurA, 0, 0, bw, bh);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.globalAlpha = S;
  ctx.drawImage(blurB, 0, 0, W, H);
  ctx.globalAlpha = 1;
  DBG.blurs++;
}

function drawCloud(c, cl){
  const s = cl.sprite; if (!s || cl.baking) return;
  const w = s.width / DPR, h = s.height / DPR;
  c.drawImage(s, sx(cl.cx) - w / 2, sy(cl.cy) - h / 2, w, h);
}

function render(){
  DBG.frames++;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';

  // the sharp frame: sky, the moving sky, then the land in front of it
  ctx.drawImage(skyC, 0, 0, W, H);
  ctx.save();
  ctx.setTransform(DPR * sk, 0, 0, DPR * sk, DPR * offX, DPR * offY);
  drawSkyLife(ctx);
  ctx.restore();
  for (const cl of CLOUDS) drawCloud(ctx, cl);
  ctx.drawImage(landC, 0, 0, W, H);

  // and the soft view of exactly that frame, crossfaded by softness
  if (S > 0.005) softPass();

  // found figures persist at any sharpness; night-revealed ones arrive dim.
  // A found cloud keeps its animal visible until the wind takes it away.
  ctx.save();
  ctx.setTransform(DPR * sk, 0, 0, DPR * sk, DPR * offX, DPR * offY);
  for (const f of FIGS){
    if (f.night) continue;
    const a = Math.max(f.found ? 0.5 : 0, f.revealed * 0.4) * (1 - S * 0.55);
    if (a > 0.01) paintFigureMassOne(ctx, f, a);
  }
  for (const cl of CLOUDS){
    if (!cl.found) continue;
    const a = 0.5 * (1 - S * 0.55);
    const pl = cl.plate, w = cl.w;
    ctx.globalAlpha = 0.5 * a;
    ctx.drawImage(pl.c, cl.cx - pl.pw * w / 2, cl.cy - pl.ph * w / 2, pl.pw * w, pl.ph * w);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // the dusk grade: gold that drains, night that pools
  const gold = Math.max(0, 1 - nightness * 1.6) * 0.26;
  if (gold > 0.01){
    if (!warmGrad || warmGradH !== H){
      warmGrad = ctx.createLinearGradient(0, H * 0.3, 0, H * 0.78);
      warmGrad.addColorStop(0, 'rgba(255,178,102,0)');
      warmGrad.addColorStop(1, 'rgba(255,158,92,1)');
      warmGradH = H;
    }
    ctx.globalAlpha = gold;
    ctx.fillStyle = warmGrad;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  if (nightness > 0){
    ctx.fillStyle = `rgba(10,10,26,${0.52 * nightness})`;
    ctx.fillRect(0, 0, W, H);
  }

  // stars arrive with the dark; the heron's are brighter as it is found
  if (nightness > 0.25){
    const heronF = FIGS.find(f => f.key === 'heron');
    const skyA = (nightness - 0.25) / 0.75;
    ctx.globalCompositeOperation = 'lighter';
    for (const st of STARS){
      const twk = REDUCED ? 1 : 1 + Math.sin(simT * st.rate + st.tw) * 0.25;
      let a = 0.5 * skyA * twk;
      let r = st.r;
      if (st.heron){
        const lift = Math.max(heronF.prog, heronF.found ? 1 : 0, heronF.revealed);
        a = skyA * (0.25 + 0.75 * lift) * twk;
        r = st.r * (1 + 0.5 * lift);
      }
      if (sy(st.y) > ridgeY(st.x) * sk + offY) continue;
      ctx.globalAlpha = clamp(a, 0, 1);
      ctx.fillStyle = '#dfe6ff';
      ctx.beginPath(); ctx.arc(sx(st.x), sy(st.y), r * sk, 0, 6.284); ctx.fill();
    }
    // the heron's linking lines, only as it settles
    const lift = Math.max(heronF.prog * 0.7, heronF.found ? 1 : 0, heronF.revealed);
    if (lift > 0.05){
      ctx.globalAlpha = 0.22 * lift * skyA;
      ctx.strokeStyle = '#b9c8f0';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i < 9; i++){
        const a2 = HERON[i], b2 = HERON[i + 1] || HERON[i];
        ctx.moveTo(sx(a2[0]), sy(a2[1])); ctx.lineTo(sx(b2[0]), sy(b2[1]));
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // the moon clears the chest of the giant at the very end — Sidelong's moon,
  // seen from the valley below
  if (moonUp > 0){
    const mx = Math.min(sx(1780), W - 60), my = sy(760) - moonUp * 210 * sk;
    const R = 22 * sk;
    const g = ctx.createRadialGradient(mx, my, R * 0.6, mx, my, R * 5);
    g.addColorStop(0, `rgba(214,226,255,${0.25 * moonUp})`);
    g.addColorStop(1, 'rgba(214,226,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(mx, my, R * 5, 0, 6.284); ctx.fill();
    ctx.fillStyle = `rgba(236,242,255,${0.92 * moonUp})`;
    ctx.beginPath(); ctx.arc(mx, my, R, 0, 6.284); ctx.fill();
    ctx.fillStyle = `rgba(198,210,238,${0.5 * moonUp})`;
    ctx.beginPath(); ctx.arc(mx - R * 0.28, my - R * 0.2, R * 0.3, 0, 6.284); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + R * 0.22, my + R * 0.26, R * 0.2, 0, 6.284); ctx.fill();
  }

  // the name, set quietly near the figure
  if (nameAlpha > 0.01 && nameShow){
    ctx.font = 'italic 16px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(240,232,224,${0.7 * nameAlpha})`;
    ctx.fillText(nameShow.name, sx(nameShow.cx), sy(nameShow.cy - nameShow.r) - 8);
  }

  // the gaze — dim; when softening, the ring relaxes wider and fainter, the
  // one mechanical readout, drawn as the eye rather than as a meter
  const ringR = 13 + S * 26;
  ctx.strokeStyle = `rgba(240,228,214,${0.14 * (1 - S * 0.6)})`;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(gx, gy, ringR, 0, 6.284); ctx.stroke();

  ctx.fillStyle = vignetteGrad;
  ctx.fillRect(0, 0, W, H);
}

// ── audio ───────────────────────────────────────────────────────────────────
// The Sidelong grammar: quiet, filter not fader, nothing beating, nothing
// gated and high. Softness opens the lowpass — as the eyes let go, the ear
// admits more — the air rises and falls with the wind, and the birds settle
// as the gold drains.
let AC = null, master = null, padLP = null, chimeBus = null, airG = null, started = false;
function startAudio(){
  if (started) return; started = true;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.4; master.connect(AC.destination);

    padLP = AC.createBiquadFilter();
    padLP.type = 'lowpass'; padLP.frequency.value = 280; padLP.Q.value = 0.5;
    padLP.connect(master);

    // an open fifth on G — a tone down from Sidelong's, the valley under its sky
    [49.0, 98.0, 146.83, 196.0].forEach((f, i) => {
      const o = AC.createOscillator();
      o.type = i < 2 ? 'sine' : 'triangle';
      o.frequency.value = f;
      const g = AC.createGain();
      g.gain.value = [0.18, 0.14, 0.06, 0.03][i];
      const lfo = AC.createOscillator(); lfo.frequency.value = 0.028 + i * 0.013;
      const lg = AC.createGain(); lg.gain.value = g.gain.value * 0.26;
      lfo.connect(lg); lg.connect(g.gain); lfo.start();
      o.connect(g); g.connect(padLP); o.start();
    });

    // evening air
    const buf = AC.createBuffer(1, AC.sampleRate * 4, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const noise = AC.createBufferSource(); noise.buffer = buf; noise.loop = true;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 420; bp.Q.value = 0.5;
    airG = AC.createGain(); airG.gain.value = 0.028;
    noise.connect(bp); bp.connect(airG); airG.connect(master); noise.start();

    chimeBus = AC.createGain(); chimeBus.gain.value = 0.5; chimeBus.connect(master);
  } catch (_) { AC = null; }
}

function updateAudio(){
  if (!AC || !padLP) return;
  padLP.frequency.setTargetAtTime(280 + 1150 * S, AC.currentTime, 1.4);
  if (airG) airG.gain.setTargetAtTime(0.028 * clamp(windNow / Math.max(1, P.wind), 0.5, 1.6), AC.currentTime, 2.5);
}

const PENT = [392.0, 440.0, 523.25, 587.33, 659.25, 784.0];
function ping(f, when, dur, level){
  if (!AC || !chimeBus) return;
  const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = f;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(level, when + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(chimeBus);
  o.start(when); o.stop(when + dur + 0.05);
}
function settleChord(){
  if (!AC) return;
  const t = AC.currentTime;
  [0, 2, 4].forEach((n, i) => ping(PENT[n], t + i * 0.2, 3.4, 0.045));
}
function birdCall(){
  if (!AC) return;
  const t = AC.currentTime;
  const f0 = 900 + Math.random() * 500;
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f0 * 1.25, t + 0.09);
  o.frequency.exponentialRampToValueAtTime(f0 * 0.9, t + 0.2);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.016 * (1 - nightness), t + 0.04);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.3);
}

// ── helpers ─────────────────────────────────────────────────────────────────
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

// ── loop ────────────────────────────────────────────────────────────────────
let prev = performance.now();
let lastFrameAt = performance.now();
let frozen = false;           // debug: stop the rAF clock for deterministic renders
function frame(now){
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;
  if (!frozen){ advance(dt); render(); }
  lastFrameAt = now;
  requestAnimationFrame(frame);
}
setInterval(() => {
  if (!frozen && performance.now() - lastFrameAt > 500){
    prev = performance.now() - 16;
    frame(performance.now());
  }
}, 250);

// ── debug API for playtesting ───────────────────────────────────────────────
// Sim state accrues from dt only, so step() is a true synchronous clock.
window.__soften = {
  P, EV, DBG, SPECIES,
  get t(){ return simT; },
  get S(){ return S; },
  get soft(){ return soft; },
  get nightness(){ return nightness; },
  get smoothSpeed(){ return smoothSpeed; },
  get holding(){ return holding; },
  get gaze(){ return [gx | 0, gy | 0]; },
  get wind(){ return +windNow.toFixed(2); },
  get seed(){ return SKY_SEED; },
  get view(){ return { sk, DPR, offX, offY, W, H, ...visBounds() }; },
  get figures(){ return FIGS.map(f => ({ key: f.key, name: f.name, prog: +f.prog.toFixed(3), found: f.found, revealed: +f.revealed.toFixed(3) })); },
  get clouds(){
    return CLOUDS.map(c => ({ id: c.id, kind: c.kind, name: c.name, z: +c.z.toFixed(2), x: c.cx | 0, y: c.cy | 0,
      ex: c.ex | 0, ey: c.ey | 0, screen: [sx(c.cx) | 0, sy(c.cy) | 0], prog: +c.prog.toFixed(3), found: c.found }));
  },
  get summary(){
    return {
      durationS: +simT.toFixed(1),
      meanSoft: +(sampleT > 0 ? softSum / sampleT : 0).toFixed(3),
      heldFrac: +(sampleT > 0 ? heldSum / sampleT : 0).toFixed(3),
      found: FIGS.filter(f => f.found).map(f => f.name).concat(EV.filter(e => e.e === 'found' && /^an? /.test(e.name)).map(e => e.name)),
      skySpeciesSeen: [...SEEN],
      animalsArrived: EV.filter(e => e.e === 'arrive' && e.kind === 'animal').map(e => e.name),
      revealedByNight: FIGS.filter(f => !f.found && f.revealed >= 1).map(f => f.name),
    };
  },
  // screen position of a figure's centre (land figure key, or a cloud id)
  figAt(key){
    const f = FIGS.find(f => f.key === key) || CLOUDS.find(c => c.id === key || (c.sp && c.sp.key === key));
    return f ? { x: sx(f.cx) | 0, y: sy(f.cy) | 0, r: (f.r * sk) | 0 } : null;
  },
  // hide any image in the sky as a low-frequency cloud animal (data URI or
  // URL). It joins the procession next. opts: { w, name, key } (w in scene units).
  embedImage(src, opts = {}){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        const key = opts.key || 'visitor';
        let sp = SPECIES.find(s => s.key === key);
        if (!sp){ sp = { key }; SPECIES.push(sp); }
        sp.name = opts.name || 'a visitor';
        sp.w = opts.w || 460;
        sp.str = opts.str || 1.6;   // an image plate is feathered and two-toned, so it needs a lift
        sp.plate = plateFromImage(img, opts);
        if (opts.next !== false){
          deck = deck.filter(s => s !== sp); deck.push(sp);
          nextAnimalAt = Math.min(nextAnimalAt, simT + 1);
        }
        resolve({ ok: true, figure: sp.name });
      };
      img.onerror = reject;
      img.src = src;
    });
  },
  // the sky, by hand — for screenshots and playtests
  clearSky(){ CLOUDS.length = 0; FLOCK = null; nextAnimalAt = nextDecoyAt = nextFlockAt = 1e9; return true; },
  resumeWeather(){ nextAnimalAt = simT + 1; nextDecoyAt = simT + 1; nextFlockAt = simT + 20; return true; },
  place(key, o = {}){
    const vb = visBounds();
    const sp = key === 'decoy' ? null : SPECIES.find(s => s.key === key);
    if (key !== 'decoy' && !(sp && sp.plate)) return null;
    const cl = makeCloud(sp ? 'animal' : 'decoy', sp, o.z ?? 1);
    cl.cx = o.x ?? (vb.xL + vb.xR) / 2;
    cl.cy = o.y ?? Math.min(P.cloudBottom - cl.ey, (vb.yT + 600) / 2);
    bakeCloud(cl); CLOUDS.push(cl); CLOUDS.sort((a, b) => a.z - b.z);
    render();
    return { id: cl.id, x: cl.cx | 0, y: cl.cy | 0, screen: [sx(cl.cx) | 0, sy(cl.cy) | 0], ex: cl.ex | 0, ey: cl.ey | 0 };
  },
  pinS(v){ S_PIN = v; if (v !== null) S = v; render(); return S; },
  freeze(on = true){ frozen = on; return frozen; },
  render(){ render(); return true; },
  // synthetic input through the real handlers' state
  look(x, y){ pointerHere = true; gTX = x; gTY = y; return [x, y]; },
  press(){ holding = true; return true; },
  releaseHold(){ holding = false; return false; },
  // hold the gaze still at a point for n seconds of world time
  rest(x, y, sec){
    if (x != null) this.look(x, y);
    gx = lastGx = gTX; gy = lastGy = gTY;
    for (let i = 0; i < Math.round(sec / 0.016); i++) advance(0.016);
    render();
    return this.summary;
  },
  // move the gaze at an exact speed on the virtual clock
  sweep(x1, y1, x2, y2, ms){
    const steps = Math.max(2, Math.round(ms / 16));
    pointerHere = true;
    gTX = x1; gTY = y1; gx = lastGx = x1; gy = lastGy = y1;
    for (let i = 1; i <= steps; i++){
      const k = i / steps;
      gTX = x1 + (x2 - x1) * k;
      gTY = y1 + (y2 - y1) * k;
      advance(0.016);
    }
    render();
    return { S: +S.toFixed(3), smoothSpeed: smoothSpeed | 0 };
  },
  step(n = 1, dt = 1 / 60){ for (let i = 0; i < n; i++) advance(dt); render(); return simT; },
  skipTo(sec){ const n = Math.max(0, Math.round((sec - simT) / 0.05)); for (let i = 0; i < n; i++) advance(0.05); render(); return simT; },
  bench(n = 200){
    const a0 = performance.now(); for (let i = 0; i < n; i++) advance(1 / 60);
    const a1 = performance.now(); for (let i = 0; i < n; i++) render();
    const a2 = performance.now();
    return { simMs: +((a1 - a0) / n).toFixed(2), renderMs: +((a2 - a1) / n).toFixed(2) };
  },
};

// The first imported figure: Pond Watch's duck, swimming in the clouds —
// painted grayscale, downsampled to 48x30 (that downsample IS what makes it
