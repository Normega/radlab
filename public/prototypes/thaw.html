<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Thaw</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b0e1a;}
  canvas{display:block;touch-action:none;cursor:crosshair;}
  #intro{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;z-index:5;
    font-family:Georgia,'Times New Roman',serif;font-style:italic;
    color:rgba(235,238,250,0.85);font-size:clamp(16px,2.6vw,22px);
    text-shadow:0 1px 8px rgba(0,0,0,0.5);
    opacity:0;transition:opacity 3s ease;
  }
  #tune{
    position:fixed;top:8px;right:8px;z-index:10;display:none;
    background:rgba(10,12,24,0.85);border:1px solid rgba(255,255,255,0.15);
    border-radius:8px;padding:10px 14px;font-family:ui-monospace,monospace;font-size:11px;
    color:#cbd2ea;min-width:220px;
  }
  #tune label{display:block;margin:6px 0 2px;}
  #tune input{width:100%;}
  #hint{
    position:fixed;bottom:6px;right:10px;z-index:6;
    font-family:ui-monospace,monospace;font-size:10px;color:rgba(255,255,255,0.18);
    pointer-events:none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="intro">Evening. The glass has fogged over.<br>Rub it, slowly.</div>
<div id="hint">t&nbsp;·&nbsp;tuning</div>
<script>/* tuning hint shows only with ?dev; t still opens the panel */ if(!/[?&]dev/.test(location.search)) document.getElementById('hint').style.display='none';</script>
<div id="tune">
  <label>refog rate <span id="v_refog"></span></label><input type="range" id="s_refog" min="0" max="0.02" step="0.0005">
  <label>gentle speed max (px/s) <span id="v_gentle"></span></label><input type="range" id="s_gentle" min="100" max="900" step="10">
  <label>smear speed min (px/s) <span id="v_smear"></span></label><input type="range" id="s_smear" min="500" max="2500" step="25">
  <label>brush radius <span id="v_brush"></span></label><input type="range" id="s_brush" min="14" max="90" step="2">
  <label>breath sensitivity <span id="v_breath"></span></label><input type="range" id="s_breath" min="0" max="2" step="0.05">
</div>
<script>
'use strict';
/* ============================================================
   THAW — receiving impressions.
   A fogged window at dusk; a winter garden beneath.
   Slow gentle contact lets the world come through; speed smears.
   Nothing is scored. Events happen whether or not you watch.
   ============================================================ */

const P = {                       // tunables
  refog: 0.012,                   // fog regrowth per second (alpha)
  vGentle: 380,                   // px/s under which strokes clear well
  vSmear: 1100,                   // px/s over which strokes add fog
  brushR: 46,                     // stamp radius, css px
  breathGain: 0.8,                // how quickly hurry fogs the bottom
  duration: 300,                  // session seconds until the cold clears the pane
  evFirst: 18,                    // s: the garden's first event
  evGapMin: 16, evGapMax: 24,     // s between events dealt from the deck
};

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W=0, H=0, DPR=1;

// --- offscreen layers -----------------------------------------------------
const sceneC = document.createElement('canvas');  const sctx = sceneC.getContext('2d');
const softC  = document.createElement('canvas');  const softx = softC.getContext('2d');   // half-res soft base
const fogC   = document.createElement('canvas');  const fctx = fogC.getContext('2d');     // frost alpha map
const maskC  = document.createElement('canvas');  const mctx = maskC.getContext('2d');    // sharp scene minus fog
const FOG_SCALE = 0.35;

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  sceneC.width=W; sceneC.height=H;
  maskC.width=W; maskC.height=H;
  softC.width=Math.ceil(W/2); softC.height=Math.ceil(H/2);
  const fw=Math.ceil(W*FOG_SCALE), fh=Math.ceil(H*FOG_SCALE);
  // preserve fog on resize where possible
  DBG.resizes++;
  const keep = fogInited ? (()=>{const t=document.createElement('canvas');t.width=fogC.width;t.height=fogC.height;t.getContext('2d').drawImage(fogC,0,0);return t;})() : null;
  fogC.width=fw; fogC.height=fh;
  if(keep){ fctx.drawImage(keep,0,0,fw,fh); } else { initFog(); fogInited=true; }
  buildWorld();
}

// --- frost ----------------------------------------------------------------
let fogInited=false;
const DBG={resizes:0,initFogRuns:0,frames:0};
function initFog(){
  DBG.initFogRuns++;
  const w=fogC.width, h=fogC.height;
  fctx.globalCompositeOperation='source-over';
  fctx.clearRect(0,0,w,h);
  fctx.fillStyle='rgba(255,255,255,1)';
  fctx.fillRect(0,0,w,h);
  // crystalline unevenness
  for(let i=0;i<900;i++){
    fctx.fillStyle=`rgba(255,255,255,${Math.random()*0.1})`;
    const r=Math.random()*8+1;
    fctx.beginPath();fctx.arc(Math.random()*w,Math.random()*h,r,0,7);fctx.fill();
  }
  fctx.globalCompositeOperation='destination-out';
  for(let i=0;i<250;i++){
    fctx.fillStyle=`rgba(0,0,0,${Math.random()*0.06})`;
    const r=Math.random()*10+2;
    fctx.beginPath();fctx.arc(Math.random()*w,Math.random()*h,r,0,7);fctx.fill();
  }
  fctx.globalCompositeOperation='source-over';
}

// canvas compositing quantizes to 1/255 per fill — tiny per-frame alphas
// round to zero, so regrowth must accumulate as a debt and fire in steps
let refogDebt=0;
function refog(dt, amount){
  refogDebt+=amount*dt;
  if(refogDebt<0.02) return;
  fctx.globalCompositeOperation='source-over';
  fctx.fillStyle=`rgba(255,255,255,${Math.min(1,refogDebt)})`;
  fctx.fillRect(0,0,fogC.width,fogC.height);
  refogDebt=0;
}

// breath bloom from the bottom edge when the hands hurry (debt-stepped
// past the 1/255 quantization floor, same as refog)
let breathDebt=0;
function breathe(dt, strength){
  if(strength<=0.003) return;
  breathDebt+=Math.min(0.9,strength)*dt*2.2;
  if(breathDebt<0.03) return;
  const h=fogC.height, w=fogC.width;
  const g=fctx.createLinearGradient(0,h,0,h*0.45);
  g.addColorStop(0,`rgba(255,255,255,${Math.min(1,breathDebt)})`);
  g.addColorStop(1,'rgba(255,255,255,0)');
  fctx.globalCompositeOperation='source-over';
  fctx.fillStyle=g;
  fctx.fillRect(0,0,w,h);
  // at high heat the whole rim mists faintly, so hurry is visible anywhere
  if(strength>0.7){
    const rg=fctx.createRadialGradient(w/2,h/2,Math.min(w,h)*0.35,w/2,h/2,Math.min(w,h)*0.72);
    rg.addColorStop(0,'rgba(255,255,255,0)');
    rg.addColorStop(1,`rgba(255,255,255,${Math.min(0.6,breathDebt*0.6)})`);
    fctx.fillStyle=rg;
    fctx.fillRect(0,0,w,h);
  }
  breathDebt=0;
}

function stampClear(x,y,strength,r){
  const s=FOG_SCALE;
  fctx.globalCompositeOperation='destination-out';
  const g=fctx.createRadialGradient(x*s,y*s,0,x*s,y*s,r*s);
  g.addColorStop(0,`rgba(0,0,0,${strength})`);
  g.addColorStop(0.7,`rgba(0,0,0,${strength*0.5})`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  fctx.fillStyle=g;
  fctx.beginPath();fctx.arc(x*s,y*s,r*s,0,7);fctx.fill();
  fctx.globalCompositeOperation='source-over';
}

function stampSmear(x,y,dx,dy,r){
  const s=FOG_SCALE;
  const len=Math.hypot(dx,dy)||1;
  const nx=dx/len, ny=dy/len;
  fctx.globalCompositeOperation='source-over';
  // compacted wet streak: on full frost a fast swipe still leaves a visible
  // mark (darker, like crystals crushed to water film) — speed always answers
  fctx.fillStyle='rgba(150,162,186,0.16)';
  fctx.beginPath();
  fctx.ellipse(x*s,y*s, r*1.6*s, r*0.55*s, Math.atan2(ny,nx), 0, 7);
  fctx.fill();
  // streaky white deposit, elongated along motion
  for(let i=0;i<3;i++){
    const off=(i-1)*r*0.4;
    fctx.fillStyle=`rgba(255,255,255,${0.10+Math.random()*0.08})`;
    fctx.beginPath();
    fctx.ellipse((x+(-ny*off))*s,(y+(nx*off))*s, r*1.4*s, r*0.5*s, Math.atan2(ny,nx), 0, 7);
    fctx.fill();
  }
}

// --- the world beneath -----------------------------------------------------
// static silhouettes, regenerated per resize — from a fixed seed, so a resize
// rescales the same garden instead of growing a new one under cleared glass
// (the Sidelong treeline rule: a scene that reshuffles reads as another place)
let trees=[], fence=[], house=null, groundY=0;
function buildWorld(){
  groundY = H*0.78;
  let seed = 20260802;
  const srnd = () => { seed = (seed*1664525 + 1013904223) >>> 0; return seed/4294967296; };
  // trees: recursive bare branches
  trees=[];
  const treeXs=[W*0.13, W*0.82, W*0.94];
  for(const tx of treeXs){
    const segs=[];
    const grow=(x,y,ang,len,w,depth)=>{
      if(depth<=0||len<4) return;
      const x2=x+Math.cos(ang)*len, y2=y+Math.sin(ang)*len;
      segs.push([x,y,x2,y2,w]);
      const n=depth>3?2:(srnd()<0.7?2:1);
      for(let i=0;i<n;i++){
        grow(x2,y2, ang+(srnd()-0.5)*0.9, len*(0.68+srnd()*0.14), w*0.66, depth-1);
      }
    };
    grow(tx, groundY+6, -Math.PI/2+(srnd()-0.5)*0.15, H*0.11, 7, 7);
    trees.push(segs);
  }
  // fence
  fence=[];
  for(let x=W*0.28;x<W*0.72;x+=W*0.045){ fence.push(x); }
  house={x:W*0.62, y:groundY-H*0.135, w:W*0.13, h:H*0.135};
}
function fenceY(){ return groundY+H*0.02; }

// snow
let snowNear=[], snowFar=[];
function ensureSnow(nNear,nFar){
  while(snowNear.length<nNear) snowNear.push({x:Math.random()*W,y:Math.random()*H,v:28+Math.random()*30,ph:Math.random()*7,r:1.4+Math.random()*1.4});
  while(snowFar.length<nFar)  snowFar.push({x:Math.random()*W,y:Math.random()*H,v:12+Math.random()*14,ph:Math.random()*7,r:0.7+Math.random()*0.8});
  if(snowNear.length>nNear) snowNear.length=nNear;
  if(snowFar.length>nFar)  snowFar.length=nFar;
}

// --- the garden's events ---------------------------------------------------
// A shuffled deck, dealt across the session at jittered gaps and placed all
// over the pane — tree tops, fence, house, the far edge, the sky, the glass
// itself — so where the hand has cleared decides what gets caught. Every
// event happens whether or not anyone sees it, and nothing counts them.
// The whole schedule is fixed at load as absolute times, so skipTo() works
// and every frame is a pure function of t.
const KINDS = {
  //            dur s   earliest start (some want the dark, or the lamp lit)
  cardinal:   { dur: 40 },
  hare:       { dur: 14 },
  deer:       { dur: 34 },
  branchSnow: { dur: 7 },
  cat:        { dur: 38 },
  passer:     { dur: 7,  after: 'lamp' },
  fox:        { dur: 24 },
  moth:       { dur: 20 },
  rain:       { dur: 28 },
  moon:       { dur: 50, minT: 40 },
  owl:        { dur: 9,  minT: 85 },
  headlights: { dur: 8,  minT: 70 },
};
const lampAt = 35 + Math.random()*25;   // the house lamp comes on with the dusk
function rnd(a,b){ return a+Math.random()*(b-a); }
function hash(i,seed){ const s=Math.sin(i*12.9898+seed*78.233)*43758.5453; return s-Math.floor(s); }
function makeEvent(kind, at){
  const e = { kind, at, dur: KINDS[kind].dur, dir: Math.random()<0.5?1:-1, seed: Math.random()*1000, cued: false };
  switch(kind){
    case 'cardinal':   e.ti = Math.random()<0.6?0:1; e.tipK = rnd(0.35,0.75); break;
    case 'deer':       e.fx = e.dir>0 ? rnd(0.08,0.24) : rnd(0.76,0.92); break;
    case 'branchSnow': e.ti = (Math.random()*3)|0; e.tipK = rnd(0.1,0.6); break;
    case 'cat':        e.fx = rnd(0.25,0.75); break;
    case 'fox':        e.fx = rnd(0.3,0.7); break;
    case 'moth':       e.fx = rnd(0.15,0.85); e.fy = rnd(0.14,0.6); break;
    case 'moon':       e.fx = Math.random()<0.5 ? rnd(0.24,0.42) : rnd(0.68,0.86); break;
    case 'owl':        e.fy = rnd(0.16,0.36); break;
  }
  return e;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
function dealSchedule(){
  const pending = shuffle(Object.keys(KINDS));
  const out=[]; let t=P.evFirst;
  while(pending.length && t < P.duration-12){
    // the next card that may play now; a card that wants the dark waits in
    // the hand rather than being discarded
    const i = pending.findIndex(k => t >= (KINDS[k].after==='lamp' ? lampAt+8 : (KINDS[k].minT||0)));
    if(i<0){ t+=3; continue; }
    out.push(makeEvent(pending.splice(i,1)[0], t));
    t += rnd(P.evGapMin, P.evGapMax);
  }
  return out;
}
const SCHED = dealSchedule();

// branch tips, chosen by rank so they survive a resize (the trees are seeded)
function branchTip(ti, k){
  const segs=trees[ti]; if(!segs) return null;
  const tips=segs.filter(s=>s[4]<2 && s[3]<groundY-H*0.12).sort((a,b)=>a[3]-b[3]);
  if(!tips.length) return null;
  const s=tips[Math.min(tips.length-1, Math.floor(k*tips.length))];
  return [s[2],s[3]];
}

let prints=[];   // tracks in the snow, fading as fresh snow fills them
function leavePrint(x,y,rx,ry,a){ prints.push({x,y,rx,ry,a,at:T()}); if(prints.length>400) prints.splice(0,100); }

function skyColors(t){
  // dusk -> night
  const k = smooth01(clamp((t-10)/160,0,1));
  const top   = lerpC([38,42,84],[8,10,26],k);
  const mid   = lerpC([96,66,98],[16,18,42],k);
  const low   = lerpC([176,110,110],[30,26,52],k);
  return {top,mid,low,k};
}

function active(t,e,pre){ return t>e.at-(pre||0) && t<e.at+e.dur; }

function drawScene(t, dt){
  const S=sctx;
  const sc=clamp(H/800,0.7,1.5);
  const {top,mid,low,k}=skyColors(t);
  const g=S.createLinearGradient(0,0,0,groundY);
  g.addColorStop(0,css(top)); g.addColorStop(0.55,css(mid)); g.addColorStop(1,css(low));
  S.fillStyle=g; S.fillRect(0,0,W,groundY+2);

  // stars
  if(k>0.45){
    const a=(k-0.45)/0.55;
    S.save(); S.globalAlpha=a*0.9;
    for(const st of stars){
      const tw=0.6+0.4*Math.sin(t*st.s+st.p);
      S.fillStyle=`rgba(235,240,255,${st.a*tw})`;
      S.fillRect(st.x,st.y,st.r,st.r);
    }
    S.restore();
  }

  // the moon — once risen it stays
  moonPos=null;
  for(const e of SCHED) if(e.kind==='moon' && t>e.at) drawMoon(S,t,e);
  for(const e of SCHED) if(e.kind==='owl' && active(t,e)) drawOwl(S,t-e.at,e,sc);

  // snow ground
  const gg=S.createLinearGradient(0,groundY,0,H);
  const gTop=lerpC([222,222,238],[70,76,120],k*0.85);
  const gBot=lerpC([200,202,226],[42,46,84],k*0.85);
  gg.addColorStop(0,css(gTop)); gg.addColorStop(1,css(gBot));
  S.fillStyle=gg; S.fillRect(0,groundY,W,H-groundY);
  // drift bumps
  S.fillStyle=`rgba(255,255,255,${0.25-0.18*k})`;
  for(let i=0;i<5;i++){
    S.beginPath();
    S.ellipse(W*(0.1+i*0.2), groundY+8+i*3, W*0.14, 8, 0, 0, 7);
    S.fill();
  }
  // tracks
  for(const pr of prints){
    const a=Math.max(0,pr.a*(1-(t-pr.at)/90));
    if(a<=0) continue;
    S.fillStyle=`rgba(60,66,110,${a})`;
    S.beginPath();S.ellipse(pr.x,pr.y,pr.rx,pr.ry,0,0,7);S.fill();
  }

  // the far edge: the fox keeps to it
  for(const e of SCHED) if(e.kind==='fox' && active(t,e)) drawFox(S,t-e.at,e,sc);

  // house
  const hh=house;
  S.fillStyle=`rgba(22,20,34,${0.92})`;
  S.beginPath();
  S.rect(hh.x,hh.y,hh.w,hh.h);
  S.moveTo(hh.x-hh.w*0.08,hh.y);
  S.lineTo(hh.x+hh.w*0.5,hh.y-hh.h*0.5);
  S.lineTo(hh.x+hh.w*1.08,hh.y);
  S.closePath(); S.fill();
  // chimney + smoke
  S.fillRect(hh.x+hh.w*0.72, hh.y-hh.h*0.42, hh.w*0.12, hh.h*0.3);
  for(let i=0;i<5;i++){
    const sp=(t*0.25+i*0.8)%4;
    S.fillStyle=`rgba(200,200,210,${0.10*(1-sp/4)})`;
    S.beginPath();
    S.arc(hh.x+hh.w*0.78+Math.sin(t*0.7+i)*6+sp*4, hh.y-hh.h*0.45-sp*14, 4+sp*3.4,0,7);
    S.fill();
  }
  // window — lights with the dusk, non-contingently; someone may cross it
  if(t>lampAt){
    const wa=smooth01(clamp((t-lampAt)/6,0,1));
    const wx=hh.x+hh.w*0.22, wy=hh.y+hh.h*0.3, ww=hh.w*0.24, wh=hh.h*0.34;
    const wg=S.createRadialGradient(wx+ww/2,wy+wh/2,2,wx+ww/2,wy+wh/2,ww*2.4);
    wg.addColorStop(0,`rgba(255,196,110,${0.5*wa})`);wg.addColorStop(1,'rgba(255,196,110,0)');
    S.fillStyle=wg;S.fillRect(wx-ww*2,wy-wh*2,ww*5,wh*5);
    S.fillStyle=`rgba(255,206,130,${0.92*wa})`;
    S.fillRect(wx,wy,ww,wh);
    for(const e of SCHED) if(e.kind==='passer' && active(t,e)) drawPasser(S,t-e.at,e,wx,wy,ww,wh);
    S.strokeStyle='rgba(22,20,34,0.9)';S.lineWidth=2;
    S.strokeRect(wx,wy,ww,wh);
    S.beginPath();S.moveTo(wx+ww/2,wy);S.lineTo(wx+ww/2,wy+wh);S.moveTo(wx,wy+wh/2);S.lineTo(wx+ww,wy+wh/2);S.stroke();
  }

  // trees — a branch that has just shed its snow springs back
  S.strokeStyle=`rgba(18,16,30,0.95)`;
  S.lineCap='round';
  trees.forEach((segs,ti)=>{
    let kick=0;
    for(const e of SCHED){
      if(e.kind!=='branchSnow'||e.ti!==ti) continue;
      const u=t-e.at-0.5;
      if(u>0&&u<5) kick+=Math.exp(-u*1.3)*Math.sin(u*13)*5;
    }
    for(const [x1,y1,x2,y2,w] of segs){
      S.lineWidth=w;
      const sway=Math.sin(t*0.6+x1*0.01)*(w<2?1.6:0.3)+(w<2.5?kick:0);
      S.beginPath();S.moveTo(x1,y1);S.lineTo(x2+sway,y2);S.stroke();
    }
  });
  // snow lying on the branches that will shed it
  S.fillStyle=`rgba(240,242,255,${0.85-0.35*k})`;
  for(const e of SCHED){
    if(e.kind!=='branchSnow'||t>e.at+0.5) continue;
    const tip=branchTip(e.ti,e.tipK); if(!tip) continue;
    S.beginPath();S.ellipse(tip[0],tip[1]+1,5*sc,2.4*sc,0,0,7);S.fill();
  }

  // fence
  S.strokeStyle='rgba(24,22,38,0.9)'; S.lineWidth=3;
  const fy=fenceY();
  S.beginPath();
  for(const x of fence){ S.moveTo(x,fy);S.lineTo(x,fy-H*0.05); }
  S.moveTo(fence[0],fy-H*0.04);S.lineTo(fence[fence.length-1],fy-H*0.04);
  S.moveTo(fence[0],fy-H*0.015);S.lineTo(fence[fence.length-1],fy-H*0.015);
  S.stroke();
  // snow caps on posts
  S.fillStyle=`rgba(240,242,255,${0.8-0.4*k})`;
  for(const x of fence){ S.beginPath();S.ellipse(x,fy-H*0.05,3.4,1.8,0,0,7);S.fill(); }

  // the near garden
  for(const e of SCHED){
    if(!active(t,e)) continue;
    const u=t-e.at;
    if(e.kind==='cat') drawCat(S,u,e,sc);
    else if(e.kind==='cardinal') drawCardinal(S,u,e);
    else if(e.kind==='deer') drawDeer(S,u,e,sc);
    else if(e.kind==='hare') drawHare(S,u,e);
    else if(e.kind==='branchSnow') drawBranchSnow(S,u,e,sc);
  }

  // snowfall — begins almost at once; the first minute must not be empty
  const snowAmt = t<8?0 : t<20? (t-8)/12*1.6 : (t<150?1.6: Math.min(2.6,(t-150)/40+1.6));
  ensureSnow(Math.floor(60*snowAmt), Math.floor(90*snowAmt));
  S.fillStyle='rgba(245,247,255,0.9)';
  for(const f of snowFar){
    f.y+=f.v*dt; f.x+=Math.sin(t*0.8+f.ph)*10*dt;
    if(f.y>H){f.y=-4;f.x=Math.random()*W;}
    S.globalAlpha=0.5;
    S.fillRect(f.x,f.y,f.r,f.r);
  }
  for(const f of snowNear){
    f.y+=f.v*dt; f.x+=Math.sin(t*0.7+f.ph)*16*dt;
    if(f.y>H){f.y=-4;f.x=Math.random()*W;}
    S.globalAlpha=0.85;
    S.beginPath();S.arc(f.x,f.y,f.r,0,7);S.fill();
  }
  S.globalAlpha=1;

  // whole-pane weather and light, then the thing at the glass itself
  for(const e of SCHED){
    if(!active(t,e)) continue;
    if(e.kind==='rain') drawRain(S,t,t-e.at,e);
    else if(e.kind==='headlights') drawHeadlights(S,t-e.at,e);
  }
  for(const e of SCHED) if(e.kind==='moth' && active(t,e)) drawMoth(S,t-e.at,e,sc);
}

let moonPos=null;
let stars=[];
function seedStars(){
  stars=[];
  for(let i=0;i<130;i++){
    stars.push({x:Math.random()*W,y:Math.random()*H*0.6,r:Math.random()<0.15?2:1,
      a:0.3+Math.random()*0.7,s:0.5+Math.random()*2,p:Math.random()*7});
  }
}

// --- the garden's visitors (one drawing each) -------------------------------
function drawMoon(S,t,e){
  const mp=clamp((t-e.at)/e.dur,0,1);
  const mx=W*e.fx, my=lerp(groundY*0.55, H*0.16, smooth01(mp));
  const mr=Math.min(W,H)*0.045;
  const mg=S.createRadialGradient(mx,my,mr*0.2,mx,my,mr*3.2);
  mg.addColorStop(0,'rgba(240,238,220,0.55)');mg.addColorStop(1,'rgba(240,238,220,0)');
  S.fillStyle=mg;S.beginPath();S.arc(mx,my,mr*3.2,0,7);S.fill();
  S.fillStyle='#efe9d4';S.beginPath();S.arc(mx,my,mr,0,7);S.fill();
  S.fillStyle='rgba(190,186,168,0.5)';
  S.beginPath();S.arc(mx-mr*0.3,my-mr*0.2,mr*0.18,0,7);S.fill();
  S.beginPath();S.arc(mx+mr*0.25,my+mr*0.3,mr*0.12,0,7);S.fill();
  moonPos=[mx,my,mr];
}

// across the moon if it is up, otherwise across the dark
function drawOwl(S,u,e,sc){
  const p=u/e.dur;
  const y0 = moonPos ? moonPos[1] : H*e.fy;
  const ox=e.dir>0 ? lerp(-60,W+60,p) : lerp(W+60,-60,p);
  const oy=y0+Math.sin(p*Math.PI*2)*18-10;
  S.fillStyle='rgba(10,10,18,0.9)';
  const flap=Math.sin(u*9)*0.6;
  S.save();S.translate(ox,oy);S.scale(sc,sc);
  S.beginPath();
  S.ellipse(0,0,13,5,0,0,7);
  S.moveTo(0,0);S.quadraticCurveTo(-16,-8-8*flap,-30,-2-14*flap);S.quadraticCurveTo(-14,4,0,2);
  S.moveTo(0,0);S.quadraticCurveTo(16,-8-8*flap,30,-2-14*flap);S.quadraticCurveTo(14,4,0,2);
  S.fill();S.restore();
}

// arrives, sits on a branch, tilts its head, leaves. Red is the only saturated thing.
function drawCardinal(S,u,e){
  const tip=branchTip(e.ti,e.tipK); if(!tip) return;
  const perchX=tip[0], perchY=tip[1]-6, D=e.dur;
  const side = perchX<W/2 ? -30 : W+30;
  let x,y,a=1;
  if(u<3){
    const p=smooth01(u/3);
    x=lerp(side,perchX,p); y=lerp(H*0.3,perchY,p)+Math.sin(u*10)*3*(1-p);
  } else if(u<D-5){
    x=perchX; y=perchY+Math.sin(u*2.2)*0.6;
  } else {
    const p=smooth01((u-(D-5))/4);
    x=lerp(perchX,W-side,p); y=lerp(perchY,H*0.2,p)+Math.sin(u*10)*3*p;
    a=1-p*0.2;
  }
  const facing = u<3 ? Math.sign(perchX-side) : (u<D-5 ? (Math.sin(u*0.21)>0?1:-1) : Math.sign(W/2-side));
  const tilt = (u>8 && Math.sin(u*0.5)>0.86)?0.35:0;
  S.save();S.translate(x,y);S.globalAlpha=a;S.scale(facing||1,1);S.rotate(tilt*0.4);
  S.fillStyle='#8d2f35';
  S.beginPath();S.ellipse(-9,3,7,2.6,-0.5,0,7);S.fill();
  S.fillStyle='#c0392b';
  S.beginPath();S.ellipse(0,0,7.5,6,0,0,7);S.fill();
  S.beginPath();S.arc(5.6,-5,4.2,0,7);S.fill();
  S.beginPath();S.moveTo(4,-8.4);S.lineTo(6.8,-12.4);S.lineTo(8.4,-8);S.closePath();S.fill();
  S.fillStyle='#2b1214';S.beginPath();S.arc(7,-4.6,1.9,0,7);S.fill();
  S.fillStyle='#e2a04a';S.beginPath();S.moveTo(9,-5.4);S.lineTo(12.4,-4.4);S.lineTo(9,-3.2);S.closePath();S.fill();
  S.restore();
}

// each landing leaves prints in the snow — memory in the world, not a hoard
function drawHare(S,u,e){
  const p=u/e.dur;
  const x=e.dir<0 ? lerp(W*1.05,-W*0.08,p) : lerp(-W*0.08,W*1.05,p);
  const hop=Math.abs(Math.sin(u*3.2));
  const y=groundY+H*0.055 - hop*hop*16;
  if(hop<0.12 && u-(e.lastPrint||-9)>0.4){
    e.lastPrint=u;
    leavePrint(x+6,groundY+H*0.058,3.2,1.6,0.30);
    leavePrint(x-7,groundY+H*0.062,3.2,1.6,0.30);
  }
  S.save();S.translate(x,y);S.scale(-e.dir,1);
  S.fillStyle='rgba(226,228,240,0.92)';
  S.beginPath();S.ellipse(0,0,13,8,Math.sin(u*3.2)*0.12,0,7);S.fill();
  S.beginPath();S.arc(-11,-5,5,0,7);S.fill();
  S.beginPath();S.ellipse(-12,-12,1.8,5.5,-0.25,0,7);S.fill();
  S.beginPath();S.ellipse(-9.4,-12,1.8,5.5,0.05,0,7);S.fill();
  S.beginPath();S.arc(11,-2,3,0,7);S.fill();
  S.restore();
}

// a doe steps out from beside the trees, browses, lifts her head, goes back
function drawDeer(S,u,e,sc){
  const edge = e.dir>0 ? -W*0.06 : W*1.06;
  const stand = W*e.fx;
  let x, walking=false, facing=e.dir, browse=0;
  if(u<8){ x=lerp(edge,stand,smooth01(u/8)); walking=true; }
  else if(u<26){ x=stand; browse = u<12?0 : u<14?smooth01((u-12)/2) : u<23?1 : 1-smooth01((u-23)/2); }
  else { x=lerp(stand,edge,smooth01((u-26)/8)); walking=true; facing=-e.dir; }
  const gy=groundY+H*0.035;
  if(walking && Math.sin(u*5)>0.97 && u-(e.lastPrint||-9)>0.3){ e.lastPrint=u; leavePrint(x,gy+1,2,1.1,0.24); }
  S.save();S.translate(x,gy);S.scale(facing*sc*1.2,sc*1.2);
  S.strokeStyle=S.fillStyle='rgba(52,38,34,0.95)';
  S.lineCap='round';S.lineWidth=2.6;
  // legs
  S.beginPath();
  [[-13,0],[-9,1.6],[11,0.8],[15,2.4]].forEach(([lx,ph])=>{
    const sw=walking?Math.sin(u*5+ph)*0.35:0;
    S.moveTo(lx,-24);S.lineTo(lx+Math.sin(sw)*20,-24+Math.cos(sw)*24);
  });
  S.stroke();
  // body + white tail
  S.beginPath();S.ellipse(0,-30,21,9.5,0,0,7);S.fill();
  S.fillStyle='rgba(236,232,224,0.9)';S.beginPath();S.ellipse(-21,-33,2.4,4,0.4,0,7);S.fill();
  S.fillStyle='rgba(52,38,34,0.95)';
  // neck + head, lowering to the snow and back
  const hx=lerp(26,30,browse), hy=lerp(-56,-6,browse);
  S.lineWidth=7;S.beginPath();S.moveTo(14,-34);S.lineTo(hx-3,hy+4);S.stroke();
  S.beginPath();S.ellipse(hx+3,hy,7.5,3.8,lerp(0.25,1.2,browse),0,7);S.fill();
  if(browse<0.5){
    S.beginPath();S.ellipse(hx-3,hy-6,1.8,4.4,-0.5,0,7);S.fill();
    S.beginPath();S.ellipse(hx,hy-6.5,1.8,4.4,-0.1,0,7);S.fill();
  }
  S.restore();
}

// trots along the far edge, stops to look toward the house, trots on
function drawFox(S,u,e,sc){
  const from = e.dir>0 ? -W*0.05 : W*1.05, to = e.dir>0 ? W*1.05 : -W*0.05;
  const stop = W*e.fx;
  let x, moving=true, look=0;
  if(u<9) x=lerp(from,stop,u/9);
  else if(u<15){ x=stop; moving=false; look=Math.sin((u-9)/6*Math.PI); }
  else x=lerp(stop,to,(u-15)/9);
  const gy=groundY+H*0.014;
  if(moving && u-(e.lastPrint||-9)>0.32){ e.lastPrint=u; leavePrint(x,gy+1,1.6,0.9,0.22); }
  S.save();S.translate(x,gy);S.scale(e.dir*sc*1.2,sc*1.2);
  S.lineCap='round';
  S.strokeStyle='#2c1c14';S.lineWidth=2;
  S.beginPath();
  [[-9,0],[-6,1.6],[7,0.8],[10,2.4]].forEach(([lx,ph])=>{
    const sw=moving?Math.sin(u*9+ph)*0.45:0;
    S.moveTo(lx,-9);S.lineTo(lx+Math.sin(sw)*9,-9+Math.cos(sw)*9);
  });
  S.stroke();
  S.fillStyle='#9c5530';
  S.beginPath();S.ellipse(-20,-11+(moving?Math.sin(u*9)*0.8:0),11,4.2,-0.15,0,7);S.fill();   // brush
  S.fillStyle='#e8e2d8';S.beginPath();S.ellipse(-29,-10,3.4,2.4,-0.15,0,7);S.fill();          // its white tip
  S.fillStyle='#a65a33';
  S.beginPath();S.ellipse(0,-12,12,5,0,0,7);S.fill();
  S.save();S.translate(12,-15);S.rotate(-look*0.55);
  S.beginPath();S.moveTo(-3,-3);S.lineTo(9,1);S.lineTo(-2,4);S.closePath();S.fill();       // head + snout
  S.beginPath();S.moveTo(-3,-3);S.lineTo(-2,-9);S.lineTo(1,-3);S.closePath();S.fill();     // ears
  S.beginPath();S.moveTo(1,-3);S.lineTo(3,-8.5);S.lineTo(4.5,-2);S.closePath();S.fill();
  S.restore();
  S.restore();
}

// walks the top rail, sits a long while with its tail hanging, drops down behind
function drawCat(S,u,e,sc){
  const fy=fenceY()-H*0.04;
  const end = e.dir>0 ? fence[0] : fence[fence.length-1];
  const sit = lerp(fence[0],fence[fence.length-1],e.fx);
  let x=sit, a=1, dy=0, sitting=false;
  if(u<11) x=lerp(end,sit,smooth01(u/11));
  else if(u<33) sitting=true;
  else { const p=(u-33)/5; dy=p*p*14; a=1-p; sitting=p<0.3; }
  S.save();S.translate(x,fy-1.5+dy);S.scale(e.dir*sc,sc);S.globalAlpha=a;
  S.fillStyle=S.strokeStyle='rgba(16,14,26,0.97)';S.lineCap='round';
  if(!sitting){
    S.lineWidth=1.8;S.beginPath();
    [[-7,0],[-4,1.6],[5,0.8],[8,2.4]].forEach(([lx,ph])=>{
      const sw=Math.sin(u*6+ph)*0.4; S.moveTo(lx,-4);S.lineTo(lx+Math.sin(sw)*5,1);
    });
    S.stroke();
    S.beginPath();S.ellipse(0,-7,10,4.2,0,0,7);S.fill();
    S.beginPath();S.arc(11,-10,3.8,0,7);S.fill();
    S.lineWidth=2.2;S.beginPath();S.moveTo(-9,-8);S.quadraticCurveTo(-16,-12,-15,-20+Math.sin(u*2)*2);S.stroke();
  } else {
    S.beginPath();S.ellipse(0,-8,5.6,8.4,0,0,7);S.fill();
    S.beginPath();S.arc(2,-18,4.2,0,7);S.fill();
    // tail hangs off the rail and swishes
    const sw=Math.sin(u*1.3)*4;
    S.lineWidth=2.2;S.beginPath();S.moveTo(-4,-2);S.quadraticCurveTo(-7,8,-5+sw,18);S.stroke();
  }
  const hx=sitting?2:11, hy=sitting?-18:-10;
  S.beginPath();S.moveTo(hx-3.6,hy-1.5);S.lineTo(hx-2.6,hy-7);S.lineTo(hx-0.4,hy-3);S.closePath();S.fill();
  S.beginPath();S.moveTo(hx+0.6,hy-3);S.lineTo(hx+2.8,hy-7);S.lineTo(hx+3.8,hy-1.5);S.closePath();S.fill();
  S.restore();
}

// snow lets go of a branch, falls in a clump, puffs on the drift
function drawBranchSnow(S,u,e,sc){
  const tip=branchTip(e.ti,e.tipK); if(!tip||u<0.5) return;
  const v=u-0.5, floor=groundY+H*0.03;
  S.fillStyle='rgba(244,246,255,0.9)';
  let landed=0;
  for(let i=0;i<16;i++){
    const r1=hash(i,e.seed), r2=hash(i+40,e.seed);
    const px=tip[0]+(r1-0.5)*14*sc+v*(r2-0.5)*22*sc;
    const py=tip[1]+0.5*620*(0.8+0.4*r2)*v*v;
    if(py>floor){ landed++; continue; }
    S.globalAlpha=0.9*(1-v/6);
    S.beginPath();S.arc(px,py,(1.2+r1*2)*sc,0,7);S.fill();
  }
  // the puff where it lands
  const tl=Math.sqrt(2*(floor-tip[1])/(620*1.2));
  if(v>tl){
    const q=(v-tl)/1.6;
    if(q<1){ S.globalAlpha=0.5*(1-q); S.beginPath();S.ellipse(tip[0],floor,(10+q*26)*sc,(3+q*7)*sc,0,0,7);S.fill(); }
  }
  S.globalAlpha=1;
}

// someone crosses the lit window, backlit; pauses once in the middle
function drawPasser(S,u,e,wx,wy,ww,wh){
  const p = u<2.6 ? (u/2.6)*0.5 : u<4.2 ? 0.5 : 0.5+((u-4.2)/2.8)*0.5;
  const x = e.dir>0 ? lerp(wx-ww*0.4,wx+ww*1.4,p) : lerp(wx+ww*1.4,wx-ww*0.4,p);
  S.save();S.beginPath();S.rect(wx,wy,ww,wh);S.clip();
  S.fillStyle='rgba(70,40,22,0.82)';
  S.beginPath();S.arc(x,wy+wh*0.42,wh*0.17,0,7);S.fill();
  S.beginPath();S.ellipse(x,wy+wh*0.98,wh*0.36,wh*0.36,0,0,7);S.fill();
  S.restore();
}

// rain comes through the snow for a while, then eases off
function drawRain(S,t,u,e){
  const env=smooth01(u/5)*(1-smooth01((u-(e.dur-6))/6));
  if(env<=0) return;
  S.save();
  S.strokeStyle=`rgba(200,212,236,${0.32*env})`;
  S.lineWidth=1;
  S.beginPath();
  const n=Math.floor(220*env);
  for(let i=0;i<n;i++){
    const fx=hash(i,e.seed), fy=hash(i+500,e.seed);
    const y=(fy*H + t*(620+fx*200))%(H+30)-15;
    const x=(fx*W + y*0.18)%W;
    S.moveTo(x,y);S.lineTo(x+3,y+15);
  }
  S.stroke();
  S.restore();
}

// a car on the road beyond the garden: its lights sweep across the snow
function drawHeadlights(S,u,e){
  const p=u/e.dur, env=Math.sin(Math.PI*clamp(p,0,1));
  const bx = e.dir>0 ? lerp(-W*0.3,W*1.3,p) : lerp(W*1.3,-W*0.3,p);
  S.save();
  S.globalCompositeOperation='lighter';
  S.translate(bx,groundY+H*0.03);S.scale(3.2,1);
  const r=H*0.2;
  const lg=S.createRadialGradient(0,0,0,0,0,r);
  lg.addColorStop(0,`rgba(255,236,196,${0.26*env})`);
  lg.addColorStop(1,'rgba(255,236,196,0)');
  S.fillStyle=lg;S.beginPath();S.arc(0,0,r,0,7);S.fill();
  S.restore();
}

// at the glass itself: drawn to the room light, it circles, settles, leaves
function drawMoth(S,u,e,sc){
  const cx=W*e.fx, cy=H*e.fy;
  let x,y,flap,a=1;
  if(u<8 || u>=13){
    const w=u<8?u:u-13;
    const r=(22+10*Math.sin(w*1.7))*sc;
    x=cx+Math.cos(w*3.1+e.seed)*r+Math.sin(w*7.3)*4;
    y=cy+Math.sin(w*2.3+e.seed)*r*0.7+Math.cos(w*5.9)*4;
    if(u<1.2) a=u/1.2;
    if(u>=13){ const q=(u-13)/7; y-=q*q*H*0.5; x+=e.dir*q*W*0.1; a=1-q; }
    flap=Math.abs(Math.sin(u*38));
  } else { x=cx; y=cy; flap=0.15+0.1*Math.sin(u*2); }
  S.save();S.translate(x,y);S.scale(sc*2,sc*2);S.globalAlpha=clamp(a,0,1);
  S.fillStyle='rgba(232,224,204,0.9)';
  const ww=1-flap*0.75;
  S.beginPath();S.ellipse(-4.2*ww,-1,5*ww,3.6,-0.5,0,7);S.fill();
  S.beginPath();S.ellipse(4.2*ww,-1,5*ww,3.6,0.5,0,7);S.fill();
  S.beginPath();S.ellipse(-3*ww,3,3.4*ww,2.4,0.4,0,7);S.fill();
  S.beginPath();S.ellipse(3*ww,3,3.4*ww,2.4,-0.4,0,7);S.fill();
  S.fillStyle='rgba(90,76,62,0.95)';
  S.beginPath();S.ellipse(0,1,1.3,4.2,0,0,7);S.fill();
  S.restore();
}

// --- input -----------------------------------------------------------------
let pointerDown=false, lastPt=null, lastT=0, breathHeat=0, squeak=0, lastMoveAt=0;
cv.addEventListener('pointerdown',e=>{
  pointerDown=true; lastPt=[e.clientX,e.clientY]; lastT=performance.now();
  cv.setPointerCapture(e.pointerId);
  startAudio();
});
cv.addEventListener('pointermove',e=>{
  if(!pointerDown) return;
  processMove(e.clientX,e.clientY,performance.now());
});
function processMove(x,y,now){
  const dtms=Math.max(1,now-lastT);
  const dx=x-lastPt[0], dy=y-lastPt[1];
  const dist=Math.hypot(dx,dy);
  const speed=dist/(dtms/1000);
  // stamp along segment
  const steps=Math.max(1,Math.floor(dist/(P.brushR*0.35)));
  for(let i=1;i<=steps;i++){
    const px=lastPt[0]+dx*i/steps, py=lastPt[1]+dy*i/steps;
    if(speed<P.vGentle){
      // low ceiling: even a perfect pass takes 2-4 wipes — the image comes
      // through gradually rather than the surface being deleted
      const st=0.11*(1-speed/(P.vGentle*1.35));
      stampClear(px,py,Math.max(0.03,st),P.brushR);
      squeak=Math.min(1,squeak+0.08);
    } else if(speed>P.vSmear){
      stampSmear(px,py,dx,dy,P.brushR*0.8);
      breathHeat=Math.min(1.6,breathHeat+0.05*P.breathGain);
    } else {
      const k=(speed-P.vGentle)/(P.vSmear-P.vGentle); // fades from weak clear to nothing
      const st=0.10*(1-k);
      if(st>0.015) stampClear(px,py,st,P.brushR*0.9);
    }
  }
  if(speed>P.vSmear*0.7) breathHeat=Math.min(1.6,breathHeat+0.01*P.breathGain);
  lastPt=[x,y]; lastT=now; lastMoveAt=now;
}
window.addEventListener('pointerup',()=>{pointerDown=false;lastPt=null;});
window.addEventListener('pointercancel',()=>{pointerDown=false;lastPt=null;});

// --- audio -----------------------------------------------------------------
let AC=null, outsideLP=null, windGain=null, started=false;
function startAudio(){
  if(started) return; started=true;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const master=AC.createGain(); master.gain.value=0.5; master.connect(AC.destination);
    // outside bus: everything beyond the glass passes a lowpass whose cutoff follows clearness
    outsideLP=AC.createBiquadFilter(); outsideLP.type='lowpass'; outsideLP.frequency.value=420; outsideLP.Q.value=0.4;
    outsideLP.connect(master);
    // wind: filtered noise with slow gust LFO
    const buf=AC.createBuffer(1,AC.sampleRate*4,AC.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const noise=AC.createBufferSource(); noise.buffer=buf; noise.loop=true;
    const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=380; bp.Q.value=0.6;
    windGain=AC.createGain(); windGain.gain.value=0.05;
    noise.connect(bp); bp.connect(windGain); windGain.connect(outsideLP);
    noise.start();
    const lfo=AC.createOscillator(); lfo.frequency.value=0.07;
    const lfoG=AC.createGain(); lfoG.gain.value=0.03;
    lfo.connect(lfoG); lfoG.connect(windGain.gain); lfo.start();
    noiseBuf=buf;
    // sound comes through the glass whether or not the pane is clear there:
    // a cardinal is heard before it is seen, and an owl hoots before it
    // crosses, which invites clearing toward them
    setInterval(()=>{
      if(!AC) return;
      const t=T();
      for(const e of SCHED){
        if(e.kind!=='cardinal') continue;
        if(t>e.at+6 && t<e.at+e.dur-6 && Math.random()<0.5) chirp();
        else if(t>e.at-14 && t<e.at-4 && Math.random()<0.35) chirp();
      }
    }, 3500);
  }catch(e){/* audio is optional */}
}
let noiseBuf=null;
// one-shot cues, checked every frame so skipTo() cannot step over them
function cues(t){
  if(!AC) return;
  for(const e of SCHED){
    if(e.cued) continue;
    if(e.kind==='owl' && t>e.at-6 && t<e.at+e.dur){ e.cued=true; hoot(); }
    else if(e.kind==='headlights' && t>e.at-1.5 && t<e.at+e.dur){ e.cued=true; rumble(e.dur+2); }
  }
}
// a car passing on the road: low noise, swelling and fading, through the glass
function rumble(dur){
  if(!noiseBuf) return;
  const t0=AC.currentTime;
  const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=140;
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.10,t0+dur*0.5);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(lp);lp.connect(g);g.connect(outsideLP);
  src.start(t0);src.stop(t0+dur+0.1);
}
function hoot(){
  const t0=AC.currentTime;
  for(const [dt0,f] of [[0,310],[0.5,260]]){
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(f,t0+dt0);
    o.frequency.exponentialRampToValueAtTime(f*0.93,t0+dt0+0.35);
    g.gain.setValueAtTime(0,t0+dt0);
    g.gain.linearRampToValueAtTime(0.09,t0+dt0+0.08);
    g.gain.exponentialRampToValueAtTime(0.001,t0+dt0+0.45);
    o.connect(g);g.connect(outsideLP);
    o.start(t0+dt0);o.stop(t0+dt0+0.5);
  }
}
function chirp(){
  const t0=AC.currentTime;
  for(let i=0;i<3;i++){
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='sine';
    const st=t0+i*0.16;
    o.frequency.setValueAtTime(2900,st);
    o.frequency.exponentialRampToValueAtTime(2100,st+0.09);
    g.gain.setValueAtTime(0,st);
    g.gain.linearRampToValueAtTime(0.12,st+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,st+0.14);
    o.connect(g);g.connect(outsideLP);
    o.start(st);o.stop(st+0.16);
  }
}
// glass squeak on gentle rubbing — tactile, quiet
let squeakOsc=null,squeakGain=null;
function updateSqueak(dt){
  if(!AC) return;
  if(!squeakOsc){
    squeakOsc=AC.createOscillator();squeakOsc.type='triangle';squeakOsc.frequency.value=1400;
    squeakGain=AC.createGain();squeakGain.gain.value=0;
    const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1500;f.Q.value=8;
    squeakOsc.connect(f);f.connect(squeakGain);squeakGain.connect(AC.destination);
    squeakOsc.start();
  }
  squeak=Math.max(0,squeak-dt*2.2);
  const target=squeak*0.015;
  squeakGain.gain.setTargetAtTime(target,AC.currentTime,0.05);
  squeakOsc.frequency.setTargetAtTime(1250+Math.random()*420,AC.currentTime,0.06);
}

// clearness estimate (for audio filter + ending) — sampled coarsely, cheap
let clearFrac=0, lastSample=0;
function sampleClearness(now){
  if(now-lastSample<1000) return;
  lastSample=now;
  try{
    const w=32,h=20;
    const tmp=sampleClearness.tmp||(sampleClearness.tmp=document.createElement('canvas'));
    tmp.width=w;tmp.height=h;
    const tc=tmp.getContext('2d',{willReadFrequently:true});
    tc.clearRect(0,0,w,h);
    tc.drawImage(fogC,0,0,w,h);
    const px=tc.getImageData(0,0,w,h).data;
    let sum=0;
    for(let i=3;i<px.length;i+=4) sum+=px[i];
    clearFrac=1-(sum/255/(w*h));
  }catch(e){}
  if(outsideLP) outsideLP.frequency.setTargetAtTime(300+clearFrac*5200, AC.currentTime, 0.6);
}

// --- ending: the cold takes the pane ---------------------------------------
function coldClear(t,dt){
  if(t<P.duration) return;
  const p=Math.min(1,(t-P.duration)/45);
  // erode from edges inward — inset travels the FULL radius so the pane
  // center thaws too, and a late whole-pane fade guarantees completion
  const w=fogC.width,h=fogC.height;
  fctx.globalCompositeOperation='destination-out';
  const inset=p*Math.min(w,h)*1.25;
  const g=fctx.createRadialGradient(w/2,h/2,Math.max(2,Math.min(w,h)*0.85-inset),w/2,h/2,Math.max(3,Math.min(w,h)*1.15-inset));
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,`rgba(0,0,0,${dt*1.6})`);
  fctx.fillStyle=g;fctx.fillRect(0,0,w,h);
  if(p>0.8){
    fctx.fillStyle=`rgba(0,0,0,${dt*0.9*(p-0.8)/0.2})`;
    fctx.fillRect(0,0,w,h);
  }
  fctx.globalCompositeOperation='source-over';
}

// --- main loop --------------------------------------------------------------
const t0=performance.now();
function T(){ return (performance.now()-t0)/1000 + (typeof skew==='number'?skew:0); }
let prev=performance.now();
function frame(now){
  DBG.frames++;
  const dt=Math.min(0.05,(now-prev)/1000); prev=now;
  const t=T();

  drawScene(t,dt);

  // fog dynamics
  const endPhase = t>P.duration;
  // hand-warmth: a resting fingertip melts a soft opening — stillness is
  // rewarded above even slowness
  if(pointerDown&&lastPt&&performance.now()-lastMoveAt>350){
    stampClear(lastPt[0],lastPt[1],0.9*dt,P.brushR*0.62);
  }
  refog(dt, endPhase?0:P.refog);
  breathHeat=Math.max(0,breathHeat-dt*0.25);
  breathe(dt, endPhase?0:breathHeat*0.35);
  coldClear(t,dt);

  // soft (frosted) base: half-res upscale of the scene, lifted toward white
  softx.drawImage(sceneC,0,0,softC.width,softC.height);
  softx.fillStyle='rgba(228,232,246,0.35)';
  softx.fillRect(0,0,softC.width,softC.height);

  ctx.imageSmoothingEnabled=true;
  ctx.clearRect(0,0,W,H);
  ctx.filter='blur(5px)';
  ctx.drawImage(softC,0,0,W,H);
  ctx.filter='none';

  // sharp scene where the glass is clear
  mctx.globalCompositeOperation='source-over';
  mctx.clearRect(0,0,W,H);
  mctx.drawImage(sceneC,0,0);
  mctx.globalCompositeOperation='destination-out';
  mctx.drawImage(fogC,0,0,W,H);
  mctx.globalCompositeOperation='source-over';
  ctx.drawImage(maskC,0,0);

  // frost itself, softly white over the blurred base
  ctx.save();
  ctx.globalAlpha=0.5;
  ctx.drawImage(fogC,0,0,W,H);
  ctx.restore();

  // window frame vignette
  frameVignette();

  updateSqueak(dt);
  cues(t);
  sampleClearness(now);

  lastFrameAt=now;
  requestAnimationFrame(frame);
}

// headless watchdog: keep the world alive when rAF is throttled (hidden tab,
// un-composited pane) so automated playtests and background time still work
let lastFrameAt=performance.now();
setInterval(()=>{
  if(performance.now()-lastFrameAt>500) frame(performance.now());
},250);

function frameVignette(){
  const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.42,W/2,H/2,Math.max(W,H)*0.75);
  g.addColorStop(0,'rgba(8,8,16,0)');
  g.addColorStop(1,'rgba(8,8,16,0.55)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(30,26,40,0.9)';
  ctx.lineWidth=10;
  ctx.strokeRect(3,3,W-6,H-6);
}

// --- helpers ---------------------------------------------------------------
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,k){return a+(b-a)*k;}
function smooth01(k){k=clamp(k,0,1);return k*k*(3-2*k);}
function lerpC(a,b,k){return [lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k)];}
function css(c){return `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;}

// --- tuning panel ----------------------------------------------------------
const panel=document.getElementById('tune');
window.addEventListener('keydown',e=>{
  if(e.key==='t') panel.style.display=panel.style.display==='block'?'none':'block';
});
function bind(id,key,fmt){
  const s=document.getElementById('s_'+id), v=document.getElementById('v_'+id);
  s.value=P[key];
  v.textContent=fmt(P[key]);
  s.addEventListener('input',()=>{P[key]=parseFloat(s.value);v.textContent=fmt(P[key]);});
}
bind('refog','refog',x=>x.toFixed(4));
bind('gentle','vGentle',x=>x|0);
bind('smear','vSmear',x=>x|0);
bind('brush','brushR',x=>x|0);
bind('breath','breathGain',x=>x.toFixed(2));

// --- debug API for playtesting ---------------------------------------------
window.__thaw = {
  P,
  get t(){ return T(); },
  get clearFrac(){ return clearFrac; },
  get breathHeat(){ return breathHeat; },
  get schedule(){ return SCHED.map(e=>({kind:e.kind,at:+e.at.toFixed(1)})); },
  get lampAt(){ return +lampAt.toFixed(1); },
  KINDS,
  // synthetic stroke with a virtual clock — immune to background-tab timer
  // throttling, so tested speeds are exactly as specified
  stroke(x1,y1,x2,y2,ms){
    const steps=Math.max(2,Math.floor(ms/16));
    let vnow=performance.now();
    pointerDown=true; lastPt=[x1,y1]; lastT=vnow;
    for(let i=1;i<=steps;i++){
      const k=i/steps;
      vnow+=16;
      processMove(x1+(x2-x1)*k, y1+(y2-y1)*k, vnow);
    }
    pointerDown=false; lastPt=null;
    return `stroked ${Math.hypot(x2-x1,y2-y1)|0}px over ${ms}ms (${(Math.hypot(x2-x1,y2-y1)/(ms/1000))|0}px/s)`;
  },
  skipTo(sec){ /* jump the session clock */ skew = sec - (performance.now()-t0)/1000; return 'now t='+T(); },
  sampleNow(){ lastSample=0; sampleClearness(performance.now()+2000); return clearFrac; },
  fogCanvas(){ return fogC; },
  DBG,
  resetFog(){ initFog(); },
};
let skew=0;

// --- go --------------------------------------------------------------------
if(!/dev/.test(location.search)) document.getElementById('hint').style.display='none';
resize();
seedStars();
window.addEventListener('resize',resize);
const intro=document.getElementById('intro');
setTimeout(()=>{intro.style.opacity=1;},600);
setTimeout(()=>{intro.style.opacity=0;},9000);
requestAnimationFrame(frame);
</script>
</body>
