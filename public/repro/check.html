<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Reproducibility Checklist</title>
<style>
:root {
  --bg: #f6f4ef; --card: #ffffff; --ink: #1d1d1f; --ink2: #4a4a50; --muted: #6e6e75;
  --line: #e2ded5; --accent: #2f5d8a; --accent-ink: #ffffff; --accent-soft: #e7eef6;
  --ok: #2e7d4f; --ok-soft: #e5f3ea; --warn: #9a5b00; --warn-soft: #fbf0dc;
  --bad: #b3261e; --bad-soft: #fbe7e5; --code: #f1efe9; --focus: #2f5d8a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181b; --card: #212226; --ink: #ececef; --ink2: #c4c4ca; --muted: #9a9aa2;
    --line: #34353b; --accent: #8fb4dc; --accent-ink: #10151b; --accent-soft: #22303f;
    --ok: #79c795; --ok-soft: #1e3227; --warn: #e3b25e; --warn-soft: #3a2e19;
    --bad: #f08a80; --bad-soft: #3d2120; --code: #2b2c31; --focus: #8fb4dc;
  }
}
:root[data-theme="dark"] {
  --bg: #17181b; --card: #212226; --ink: #ececef; --ink2: #c4c4ca; --muted: #9a9aa2;
  --line: #34353b; --accent: #8fb4dc; --accent-ink: #10151b; --accent-soft: #22303f;
  --ok: #79c795; --ok-soft: #1e3227; --warn: #e3b25e; --warn-soft: #3a2e19;
  --bad: #f08a80; --bad-soft: #3d2120; --code: #2b2c31; --focus: #8fb4dc;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }
header.top { margin-bottom: 20px; }
.eyebrow { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
h1 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; }
h2 { font-size: 23px; margin: 40px 0 6px; }
h3 { font-size: 19px; margin: 0; }
p { margin: 0 0 12px; }
.lede { color: var(--ink2); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin: 14px 0; }
.bar { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }
.toc { list-style: none; padding: 0; margin: 10px 0 0; }
.toc li { display: flex; gap: 12px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.toc li:first-child { border-top: 0; }
.toc a { flex: 1; text-decoration: none; color: var(--ink); }
.toc .count { color: var(--muted); font-size: 15px; white-space: nowrap; }
.step { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin: 14px 0; overflow: hidden; }
.step.complete { border-color: var(--ok); }
.step.here { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }
.step > .head { display: flex; gap: 14px; align-items: flex-start; padding: 16px 20px; cursor: pointer; }
.step .num { flex: none; min-width: 44px; height: 32px; padding: 0 8px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 15px; }
.step.complete .num { background: var(--ok-soft); color: var(--ok); }
.step .titles { flex: 1; min-width: 0; }
.step .meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
.step .chev { flex: none; color: var(--muted); transition: transform .2s; margin-top: 4px; }
.step.open .chev { transform: rotate(90deg); }
.step > .body { display: none; padding: 0 20px 18px; border-top: 1px solid var(--line); }
.step.open > .body { display: block; }
.body > :first-child { margin-top: 16px; }
.body ol, .body ul { padding-left: 24px; margin: 0 0 12px; }
.body li { margin: 4px 0; }
.note { background: var(--warn-soft); border-left: 4px solid var(--warn); padding: 10px 14px; border-radius: 6px; margin: 12px 0; }
.tip { background: var(--accent-soft); border-left: 4px solid var(--accent); padding: 10px 14px; border-radius: 6px; margin: 12px 0; }
.stop { background: var(--bad-soft); border-left: 4px solid var(--bad); padding: 10px 14px; border-radius: 6px; margin: 12px 0; }
code { background: var(--code); padding: 1px 5px; border-radius: 4px; font: 15px/1.4 ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
.cmd { position: relative; margin: 10px 0 14px; }
.cmd pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; padding-right: 92px; margin: 0; white-space: pre-wrap; word-break: break-all; font: 15px/1.45 ui-monospace, Consolas, monospace; }
.cmd button { position: absolute; top: 8px; right: 8px; }
pre.listing { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; white-space: pre; overflow-x: auto; font: 14px/1.45 ui-monospace, Consolas, monospace; }
button, .btn { font: inherit; font-size: 15px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 7px 14px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
button.ghost, .btn.ghost { background: transparent; color: var(--accent); }
button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
.checks { list-style: none; padding: 0; margin: 16px 0 6px; border-top: 1px solid var(--line); }
.checks li { padding: 8px 0; border-bottom: 1px solid var(--line); margin: 0; }
.checks label { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.checks input { width: 22px; height: 22px; flex: none; margin-top: 2px; accent-color: var(--ok); }
.field { margin: 14px 0; }
.field > label, .field > .lab { display: block; font-weight: 600; margin-bottom: 4px; }
.field .hint { color: var(--muted); font-size: 14px; margin: -2px 0 6px; }
input[type=text], textarea, select { font: inherit; font-size: 16px; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
textarea { min-height: 90px; resize: vertical; }
textarea.mono { font: 14px/1.4 ui-monospace, Consolas, monospace; min-height: 160px; }
.choices { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.choices label { display: flex; gap: 8px; align-items: center; cursor: pointer; font-weight: 400; }
.choices input { width: 20px; height: 20px; accent-color: var(--accent); }
.who { color: var(--muted); font-size: 13px; margin-top: 2px; }
.uploads { margin: 16px 0; padding: 14px; border: 1px dashed var(--line); border-radius: 10px; }
.uploads .expect { list-style: none; padding: 0; margin: 8px 0; }
.uploads .expect li { margin: 2px 0; }
.filelist { list-style: none; padding: 0; margin: 8px 0 0; }
.filelist li { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 6px 0; border-top: 1px solid var(--line); font-size: 15px; }
.filelist .fname { font-weight: 600; overflow-wrap: anywhere; }
.msgs { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.msg { padding: 10px 12px; border-radius: 8px; margin: 8px 0; background: var(--code); }
.msg.rose { background: var(--warn-soft); }
.msg.norm { background: var(--accent-soft); }
.msg .from { font-size: 13px; color: var(--muted); margin-bottom: 2px; }
.msg .text { white-space: pre-wrap; overflow-wrap: anywhere; }
.compose { display: none; margin-top: 10px; }
.compose.on { display: block; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.status { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 5; max-width: calc(100% - 32px); text-align: center; }
.status.show { opacity: .95; }
.status.err { background: var(--bad); color: #fff; opacity: 1; }
.gate { max-width: 460px; margin: 12vh auto; padding: 0 16px; }
.small { font-size: 14px; color: var(--muted); }
.feed .msg { cursor: pointer; }
.hide { display: none !important; }
.partintro { color: var(--ink2); }
table.simple { border-collapse: collapse; width: 100%; font-size: 15px; margin: 8px 0 14px; }
table.simple th, table.simple td { text-align: left; border-bottom: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
@media (max-width: 560px) {
  body { font-size: 16px; }
  h1 { font-size: 25px; }
  .step > .head { padding: 14px; }
  .step > .body { padding: 0 14px 16px; }
  .cmd pre { padding-right: 14px; padding-bottom: 46px; }
  .cmd button { top: auto; bottom: 8px; }
}
</style>
</head>

      <p id="gateerr" class="small" role="alert" style="margin-top:10px"></p>

  </div>
</div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = { to(buf) { const b = new Uint8Array(buf); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); },
              from(s) { const bin = atob(s); const b = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return b; } };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
                del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtTime = t => new Date(t).toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const NAMES = { rose: "Rose", norm: "Norm" };

let KEY = null, TOKEN = null, WHO = null, C = null;
const S = { state: {}, msgs: {}, files: {}, lastId: 0 };   // state[item] = {v, author, at}
const pending = {};      // item -> timer
let statusTimer = null;

function status(text, err) {
  const el = $("#status"); el.textContent = text; el.className = "status show" + (err ? " err" : "");
  clearTimeout(statusTimer); if (!err) statusTimer = setTimeout(() => el.className = "status", 2200);
}

// ---------- crypto ----------
async function deriveKey(pass) {
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64.from(CFG.salt), iterations: CFG.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function dbToken(pass) {
  const h = await crypto.subtle.digest("SHA-256", enc.encode("radlab-repro-db:" + pass));
  return Array.from(new Uint8Array(h), b => b.toString(16).padStart(2, "0")).join("");
}
async function encryptBytes(bytes) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, KEY, bytes));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return b64.to(out);
}
async function decryptBytes(s) {
  const b = b64.from(s);
  return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.subarray(0, 12) }, KEY, b.subarray(12)));
}
const encryptJSON = o => encryptBytes(enc.encode(JSON.stringify(o)));
const decryptJSON = async s => JSON.parse(dec.decode(await decryptBytes(s)));
async function gzip(bytes) {
  if (!window.CompressionStream) return null;
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());
}
async function gunzip(bytes) {
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
}

// ---------- back end ----------
async function rpc(fn, args) {
  const r = await fetch(CFG.supa + "/rest/v1/rpc/" + fn, {
    method: "POST", headers: { "Content-Type": "application/json", apikey: CFG.anon },
    body: JSON.stringify(Object.assign({ p_board: CFG.board, p_token: TOKEN }, args)) });
  if (!r.ok) throw new Error(fn + " " + r.status);
  return r.json();
}
function notify(kind, ref) {
  fetch(CFG.supa + "/functions/v1/notify_repro", { method: "POST",
    headers: { "Content-Type": "application/json", apikey: CFG.anon },
    body: JSON.stringify({ board: CFG.board, token: TOKEN, kind, ref: String(ref) }) }).catch(() => {});
}

async function load() {
  let d;
  try { d = await rpc("repro_get", {}); }
  catch (e) { status("Could not reach the server. Check your internet; the page will try again.", true); return false; }
  const msgs = {}, state = {};
  for (const e of d.entries) {
    let v; try { v = await decryptJSON(e.payload); } catch (err) { continue; }
    if (e.kind === "state") state[e.item] = { v, author: e.author, at: e.at, id: e.id };
    else (msgs[e.item] = msgs[e.item] || []).push({ text: v.text, author: e.author, at: e.at, id: e.id });
  }
  const files = {};
  for (const f of d.files) {
    let m; try { m = await decryptJSON(f.meta); } catch (err) { continue; }
    (files[f.item] = files[f.item] || []).push(Object.assign(m, { id: f.id, author: f.author, at: f.at }));
  }
  for (const item of Object.keys(state)) if (!pending[item]) S.state[item] = state[item];
  S.msgs = msgs; S.files = files;
  if ($("#status").classList.contains("err")) $("#status").className = "status";
  return true;
}

// ---------- content helpers ----------
const STEPS = [];          // flat list
const BYID = {};
// The R folder from step T1. A pasted Rscript.exe or R.exe path is trimmed back to its folder. Any other
// .exe (the R-4.5.2-win.exe installer, the 2026-11 mistake that left every command pointing nowhere) is
// refused: the commands fall back to the usual folder and every one of them shows a warning.
const R_DEFAULT = "C:\\Program Files\\R\\R-4.5.2";
function rCheck(raw) {
  let d = (raw || "").trim().replace(/^"+|"+$/g, "").replace(/\//g, "\\").replace(/\\+$/, "");
  if (!d) return { dir: R_DEFAULT, problem: "" };
  d = d.replace(/\\bin(\\x64)?(\\(rscript|r)\.exe)?$/i, "");
  if (/\.exe$/i.test(d)) return { dir: R_DEFAULT, problem: "exe" };
  if (!/^[a-z]:\\/i.test(d)) return { dir: d, problem: "notpath" };
  if (!/\\R-4\.5\.2$/i.test(d)) return { dir: d, problem: "version" };
  return { dir: d, problem: "" };
}
function rDir() { return rCheck(S.state.T1?.v?.values?.rdir).dir; }
function rProblem() {
  const p = rCheck(S.state.T1?.v?.values?.rdir).problem;
  if (p === "exe") return `The R folder in step T1 is a file ending in <code>.exe</code> (probably the installer), not the folder R was installed into. Until you fix it, these commands use the usual folder, <code>${esc(R_DEFAULT)}</code>. Open step T1 and empty the box, or type the folder that ends in <code>R-4.5.2</code>.`;
  if (p === "notpath") return `The R folder in step T1 doesn't start with a drive letter (like <code>C:\\</code>), so this command will not find R. Open step T1 and fix the box, or empty it.`;
  if (p === "version") return `The R folder in step T1 doesn't end in <code>R-4.5.2</code>. If this command says <em>"cannot find the path"</em>, or setup says it needs R 4.5.2, fix the box in step T1.`;
  return "";
}
function fillVars(s) { return s.replace(/\{R\}/g, rDir()); }

function renderBody(html) {
  // links, kit downloads, commands
  html = html.replace(/\[\[link:(\w+)\|([^\]]+)\]\]/g, (m, k, label) =>
    `<a class="btn ghost" href="${esc(C.links[k])}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`);
  html = html.replace(/\[\[file:([\w.\-]+)\|([^\]]+)\]\]/g, (m, f, label) =>
    `<button type="button" class="ghost" data-kit="${esc(f)}">⬇ ${label}</button>`);
  html = html.replace(/\[\[cmd\]\]([\s\S]*?)\[\[\/cmd\]\]/g, (m, c) =>
    (c.includes("{R}") ? `<div class="stop rwarn" data-rwarn hidden></div>` : "") +
    `<div class="cmd"><pre data-tpl="${esc(c.trim())}"></pre><button type="button" class="ghost" data-copy>Copy</button></div>`);
  return html;
}

function stepEl(st) {
  const el = document.createElement("section");
  el.className = "step"; el.id = "step-" + st.id; el.dataset.item = st.id;
  const checks = (st.checks || []).map((c, i) =>
    `<li><label><input type="checkbox" data-check="${i}"><span>${c}</span></label></li>`).join("");
  const fields = (st.fields || []).map(f => {
    const id = `f-${st.id}-${f.id}`;
    let inner;
    if (f.type === "choice") inner = `<div class="choices" role="radiogroup">${f.options.map((o, i) =>
      `<label><input type="radio" name="${id}" value="${esc(o)}" data-field="${f.id}"> ${esc(o)}</label>`).join("")}</div>`;
    else if (f.type === "textarea" || f.type === "paste") inner = `<textarea id="${id}" data-field="${f.id}" class="${f.type === "paste" ? "mono" : ""}" placeholder="${esc(f.placeholder || "")}"></textarea>`;
    else inner = `<input type="text" id="${id}" data-field="${f.id}" placeholder="${esc(f.placeholder || "")}">`;
    return `<div class="field">${f.type === "choice" ? `<span class="lab">${f.label}</span>` : `<label for="${id}">${f.label}</label>`}${f.hint ? `<p class="hint">${f.hint}</p>` : ""}${inner}</div>`;
  }).join("");
  const uploads = st.uploads ? `<div class="uploads"><div class="lab"><strong>${st.uploads.label || "Upload files"}</strong></div>
      ${st.uploads.hint ? `<p class="hint small">${st.uploads.hint}</p>` : ""}
      ${st.uploads.expect ? `<ul class="expect">${st.uploads.expect.map(n => `<li data-expect="${esc(n)}">☐ <code>${esc(n)}</code></li>`).join("")}</ul>` : ""}
      <div class="row"><label class="btn"><input type="file" multiple class="hide" data-upload> Choose files…</label><span class="small" data-upmsg></span></div>
      <ul class="filelist" data-files></ul></div>` : "";
  el.innerHTML = `<div class="head" role="button" tabindex="0" aria-expanded="false">
      <span class="num">${esc(st.id)}</span>
      <div class="titles"><h3>${st.title}</h3><div class="meta">${st.time ? esc(st.time) + " · " : ""}<span data-prog></span></div></div>
      <span class="chev" aria-hidden="true">▶</span></div>
    <div class="body">${renderBody(st.body || "")}${fields}${uploads}
      ${checks ? `<ul class="checks">${checks}</ul>` : ""}
      <div class="who" data-who></div>
      <div class="msgs"><div data-msgs></div>
        <div class="row"><button type="button" class="ghost" data-compose>${WHO === "rose" ? "✋ Problem or question? Tell Norm" : "💬 Write to Rose"}</button></div>
        <div class="compose"><textarea data-msgtext placeholder="${WHO === "rose" ? "What happened? Copy any error message here too." : "Your reply"}"></textarea>
          <div class="row"><button type="button" data-send>Send</button><button type="button" class="ghost" data-cancel>Cancel</button></div></div>
      </div></div>`;
  return el;
}

function stepComplete(st) {
  const v = S.state[st.id]?.v; const n = (st.checks || []).length;
  if (!n) return false;
  return (st.checks || []).every((c, i) => v?.checks?.[i]);
}

function applyState(st) {
  const el = document.getElementById("step-" + st.id); if (!el) return;
  const rec = S.state[st.id], v = rec?.v || {};
  if (!pending[st.id]) {
    el.querySelectorAll("[data-check]").forEach(cb => cb.checked = !!v.checks?.[cb.dataset.check]);
    el.querySelectorAll("[data-field]").forEach(inp => {
      const val = v.values?.[inp.dataset.field] ?? "";
      if (inp.type === "radio") inp.checked = inp.value === val;
      else if (document.activeElement !== inp) inp.value = val;
    });
  }
  const n = (st.checks || []).length, k = (st.checks || []).filter((c, i) => v.checks?.[i]).length;
  el.querySelector("[data-prog]").textContent = n ? (k === n ? "✓ Done" : `${k} of ${n} ticked`) : "";
  el.classList.toggle("complete", stepComplete(st));
  el.querySelector("[data-who]").textContent = rec ? `Last saved by ${NAMES[rec.author]}, ${fmtTime(rec.at)}` : "";
  // messages
  const ms = S.msgs[st.id] || [];
  el.querySelector("[data-msgs]").innerHTML = ms.map(m =>
    `<div class="msg ${m.author}"><div class="from">${NAMES[m.author]} · ${fmtTime(m.at)}</div><div class="text">${esc(m.text)}</div></div>`).join("");
  // files
  const fl = el.querySelector("[data-files]");
  if (fl) {
    const fs = S.files[st.id] || [];
    fl.innerHTML = fs.map(f => `<li><span class="fname">${esc(f.name)}</span><span class="small">${(f.size / 1024).toFixed(0)} KB · ${NAMES[f.author]} · ${fmtTime(f.at)}</span>
      <button type="button" class="ghost" data-dl="${f.id}" data-name="${esc(f.name)}" data-type="${esc(f.type || "")}" data-gz="${f.gz ? 1 : 0}">⬇ Download</button></li>`).join("");
    el.querySelectorAll("[data-expect]").forEach(li => {
      const have = fs.some(f => f.name.toLowerCase() === li.dataset.expect.toLowerCase());
      li.innerHTML = (have ? "✅ " : "☐ ") + `<code>${esc(li.dataset.expect)}</code>`;
    });
  }
  // commands
  el.querySelectorAll("pre[data-tpl]").forEach(p => p.textContent = fillVars(p.dataset.tpl));
  const rp = rProblem();
  el.querySelectorAll("[data-rwarn]").forEach(w => { w.hidden = !rp; w.innerHTML = rp; });
  const rf = el.querySelector('input[data-field="rdir"]');
  if (rf) {
    let w = el.querySelector("[data-rfield]");
    if (!w) { w = document.createElement("div"); w.className = "stop"; w.dataset.rfield = ""; rf.after(w); }
    const p = rCheck(S.state.T1?.v?.values?.rdir).problem;
    w.hidden = !p;
    w.innerHTML = p === "exe" ? `This is a file ending in <code>.exe</code> (probably the installer), not the folder R was installed into. Empty the box (the commands then use <code>${esc(R_DEFAULT)}</code>), or type the folder that ends in <code>R-4.5.2</code>.`
      : p === "notpath" ? `This needs to be a full folder path starting with a drive letter, like <code>C:\\</code>. Or empty the box.`
      : p === "version" ? `This folder doesn't end in <code>R-4.5.2</code>. Check that it is the R 4.5.2 folder, not another version's.` : "";
  }
}

function refreshAll() {
  STEPS.forEach(applyState);
  // TOC and progress
  let done = 0, total = 0;
  C.parts.forEach(p => {
    const steps = p.steps.filter(s => (s.checks || []).length);
    const d = steps.filter(stepComplete).length; done += d; total += steps.length;
    const li = document.getElementById("toc-" + p.id);
    if (li) li.querySelector(".count").textContent = d === steps.length ? "✓ Done" : `${d} of ${steps.length} steps`;
  });
  $("#overall").style.width = (total ? 100 * done / total : 0) + "%";
  $("#overalltext").textContent = `${done} of ${total} steps done`;
  const here = STEPS.find(s => (s.checks || []).length && !stepComplete(s));
  document.querySelectorAll(".step.here").forEach(e => e.classList.remove("here"));
  if (here) document.getElementById("step-" + here.id).classList.add("here");
  $("#continue").dataset.target = here ? here.id : "";
  $("#continue").textContent = here ? `Continue: step ${here.id} →` : "All steps done ✓";
  // message feed
  const all = [];
  Object.entries(S.msgs).forEach(([item, ms]) => ms.forEach(m => all.push(Object.assign({ item }, m))));
  all.sort((a, b) => b.id - a.id);
  $("#feed").innerHTML = all.length ? all.slice(0, 6).map(m =>
    `<div class="msg ${m.author}" data-goto="${esc(m.item)}"><div class="from">${NAMES[m.author]} · step ${esc(m.item)} · ${fmtTime(m.at)}</div><div class="text">${esc(m.text.length > 300 ? m.text.slice(0, 300) + "…" : m.text)}</div></div>`).join("")
    : `<p class="small">No messages yet.</p>`;
}

function snapshot(st) {
  const el = document.getElementById("step-" + st.id);
  const checks = {}, values = {};
  el.querySelectorAll("[data-check]").forEach(cb => { if (cb.checked) checks[cb.dataset.check] = true; });
  el.querySelectorAll("[data-field]").forEach(inp => {
    if (inp.type === "radio") { if (inp.checked) values[inp.dataset.field] = inp.value; }
    else if (inp.value !== "") values[inp.dataset.field] = inp.value;
  });
  return { checks, values };
}

function queueSave(st, delay) {
  clearTimeout(pending[st.id]?.t);
  const wasComplete = stepComplete(st);
  const v = snapshot(st);
  S.state[st.id] = { v, author: WHO, at: new Date().toISOString() };
  store.set("repro-unsaved-" + st.id, JSON.stringify(v));
  applyState(st); refreshAll();
  pending[st.id] = { t: setTimeout(() => save(st, wasComplete), delay) };
}
async function save(st, wasComplete) {
  const v = S.state[st.id].v;
  try {
    await rpc("repro_add", { p_item: st.id, p_kind: "state", p_author: WHO, p_payload: await encryptJSON(v) });
    delete pending[st.id]; store.del("repro-unsaved-" + st.id);
    status("Saved ✓");
    if (st.notify && WHO === "rose" && stepComplete(st)) notify("step", st.id);
  } catch (e) {
    status("Not saved yet: no connection. Keep this page open; it will try again.", true);
    pending[st.id] = { t: setTimeout(() => save(st, wasComplete), 15000) };
  }
}

async function sendMsg(st, text) {
  try {
    const r = await rpc("repro_add", { p_item: st.id, p_kind: "message", p_author: WHO, p_payload: await encryptJSON({ text }) });
    (S.msgs[st.id] = S.msgs[st.id] || []).push({ text, author: WHO, at: r.at, id: r.id });
    if (WHO === "rose") notify("message", r.id);
    status(WHO === "rose" ? "Sent. Norm gets an email and will answer here." : "Sent.");
    refreshAll(); return true;
  } catch (e) { status("Not sent: no connection. Please try again.", true); return false; }
}

async function uploadFiles(st, files, msgEl) {
  for (const f of files) {
    if (f.size > 10 * 1024 * 1024) { msgEl.textContent = `${f.name} is over 10 MB; tell Norm instead.`; continue; }
    msgEl.textContent = `Uploading ${f.name}…`;
    try {
      const raw = new Uint8Array(await f.arrayBuffer());
      const gz = await gzip(raw);
      const data = await encryptBytes(gz || raw);
      const meta = await encryptJSON({ name: f.name, size: f.size, type: f.type, gz: !!gz });
      const r = await rpc("repro_add_file", { p_item: st.id, p_author: WHO, p_meta: meta, p_data: data, p_bytes: f.size });
      (S.files[st.id] = S.files[st.id] || []).push({ name: f.name, size: f.size, type: f.type, gz: !!gz, id: r.id, author: WHO, at: r.at });
      msgEl.textContent = `Uploaded ${f.name} ✓`;
    } catch (e) { msgEl.textContent = `Upload of ${f.name} failed. Check your internet and try again.`; }
    applyState(st);
  }
}

async function downloadFile(btn) {
  btn.disabled = true; const old = btn.textContent; btn.textContent = "Downloading…";
  try {
    const data = await rpc("repro_get_file", { p_id: Number(btn.dataset.dl) });
    let bytes = await decryptBytes(data);
    if (btn.dataset.gz === "1") bytes = await gunzip(bytes);
    saveBlob(new Blob([bytes], { type: btn.dataset.type || "application/octet-stream" }), btn.dataset.name);
  } catch (e) { status("Download failed. Please try again.", true); }
  btn.disabled = false; btn.textContent = old;
}
function saveBlob(blob, name) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

// ---------- page ----------
function build() {
  const app = $("#app");
  app.innerHTML = `<div class="wrap">
    <header class="top"><p class="eyebrow">${C.eyebrow}</p><h1>${C.title}</h1><p class="lede">${C.lede}</p>
      <p class="small">You are signed in as <strong>${NAMES[WHO]}</strong>. <a href="#" id="switchwho">Not ${NAMES[WHO]}?</a></p></header>
    <div class="panel"><div class="row" style="justify-content:space-between;margin:0 0 8px"><strong id="overalltext"></strong>
      <button type="button" id="continue"></button></div><div class="bar"><i id="overall"></i></div>
      <ul class="toc">${C.parts.map(p => `<li id="toc-${p.id}"><a href="#part-${p.id}">${p.title}</a><span class="count"></span></li>`).join("")}</ul></div>
    <div class="panel"><strong>Latest messages</strong><div id="feed" class="feed"></div></div>
    <div class="panel"><strong>All the links in one place</strong><div class="links">${C.allLinks.map(l => renderBody(l)).join("")}</div>
      <p class="small">${C.linksNote}</p></div>
    <div id="parts"></div>
    <p class="small" style="margin-top:40px">${C.footer}</p></div>`;
  const parts = $("#parts");
  C.parts.forEach(p => {
    const h = document.createElement("div");
    h.innerHTML = `<h2 id="part-${p.id}">${p.title}</h2>${p.intro ? `<p class="partintro">${p.intro}</p>` : ""}`;
    parts.appendChild(h);
    p.steps.forEach(st => { STEPS.push(st); BYID[st.id] = st; parts.appendChild(stepEl(st)); });
  });
  // restore unsaved local edits
  STEPS.forEach(st => { const u = store.get("repro-unsaved-" + st.id); if (u) { try { S.state[st.id] = { v: JSON.parse(u), author: WHO, at: new Date().toISOString() }; pending[st.id] = { t: setTimeout(() => save(st, false), 1000) }; } catch (e) {} } });

  app.addEventListener("click", e => {
    const t = e.target;
    const head = t.closest(".step > .head");
    if (head) { toggle(head.parentElement); return; }
    if (t.closest("#continue")) { const id = $("#continue").dataset.target; if (id) openStep(id); return; }
    if (t.closest("#switchwho")) { e.preventDefault(); store.del("repro-who"); location.reload(); return; }
    const g = t.closest("[data-goto]"); if (g) { openStep(g.dataset.goto); return; }
    if (t.matches("[data-copy]")) { const pre = t.parentElement.querySelector("pre"); copyText(pre.textContent, t); return; }
    if (t.matches("[data-kit]")) { const f = t.dataset.kit; saveBlob(new Blob([b64.from(C.files[f])], { type: "application/zip" }), f); return; }
    if (t.matches("[data-dl]")) { downloadFile(t); return; }
    const stepE = t.closest(".step"); if (!stepE) return; const st = BYID[stepE.dataset.item];
    if (t.matches("[data-compose]")) { stepE.querySelector(".compose").classList.add("on"); stepE.querySelector("[data-msgtext]").focus(); }
    if (t.matches("[data-cancel]")) stepE.querySelector(".compose").classList.remove("on");
    if (t.matches("[data-send]")) {
      const ta = stepE.querySelector("[data-msgtext]"); const text = ta.value.trim(); if (!text) return;
      t.disabled = true; sendMsg(st, text).then(ok => { t.disabled = false; if (ok) { ta.value = ""; stepE.querySelector(".compose").classList.remove("on"); } });
    }
  });
  app.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches(".step > .head")) { e.preventDefault(); toggle(e.target.parentElement); } });
  app.addEventListener("change", e => {
    const t = e.target, stepE = t.closest(".step"); if (!stepE) return; const st = BYID[stepE.dataset.item];
    if (t.matches("[data-upload]")) { uploadFiles(st, Array.from(t.files), stepE.querySelector("[data-upmsg]")).then(() => { t.value = ""; refreshAll(); }); return; }
    if (t.matches("[data-check], input[type=radio]")) queueSave(st, 400);
  });
  app.addEventListener("input", e => {
    const t = e.target, stepE = t.closest(".step"); if (!stepE || !t.matches("[data-field]") || t.type === "radio") return;
    queueSave(BYID[stepE.dataset.item], 1500);
  });
}
function toggle(el) { el.classList.toggle("open"); el.querySelector(".head").setAttribute("aria-expanded", el.classList.contains("open")); }
function openStep(id) { const el = document.getElementById("step-" + id); if (!el) return; if (!el.classList.contains("open")) toggle(el); el.scrollIntoView({ behavior: "smooth", block: "start" }); }
async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  const old = btn.textContent; btn.textContent = "Copied ✓"; setTimeout(() => btn.textContent = old, 1800);
}

function askWho() {
  return new Promise(res => {
    $("#app").innerHTML = `<div class="gate"><p class="eyebrow">RADlab</p><h1>Who is using this page?</h1>
      <p class="lede">The page records who ticked each step and who wrote each message.</p>
      <div class="row"><button type="button" data-w="rose">I'm Rose</button><button type="button" data-w="norm" class="ghost">I'm Norm</button></div></div>`;
    $("#app").addEventListener("click", function h(e) { const w = e.target.dataset?.w; if (w) { $("#app").removeEventListener("click", h); res(w); } });
  });
}

async function unlock(pass) {
  const key = await deriveKey(pass);
  const blob = b64.from(CFG.blob);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: blob.subarray(0, 12) }, key, blob.subarray(12));
  KEY = key; TOKEN = await dbToken(pass);
  return JSON.parse(dec.decode(plain));
}

async function start() {
  const params = new URLSearchParams(location.hash.slice(1));
  if (params.get("k")) store.set("repro-k", params.get("k"));
  if (params.get("who") && NAMES[params.get("who")]) store.set("repro-who", params.get("who"));
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  let pass = store.get("repro-k");
  if (pass) { try { C = await unlock(pass); } catch (e) { store.del("repro-k"); pass = null; } }
  if (!C) {
    await new Promise(res => {
      $("#gateform").addEventListener("submit", async e => {
        e.preventDefault(); const p = $("#pass").value.trim();
        try { C = await unlock(p); store.set("repro-k", p); res(); }
        catch (err) { $("#gateerr").textContent = "That passcode did not work. Check it against Norm's email."; }
      });
    });
  }
  WHO = store.get("repro-who");
  if (!NAMES[WHO]) { WHO = await askWho(); store.set("repro-who", WHO); }
  document.title = C.pageTitle;
  build(); refreshAll();
  await load(); refreshAll();
  setInterval(async () => { if (document.visibilityState === "visible" && await load()) refreshAll(); }, 30000);
  document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible" && await load()) refreshAll(); });
}
start();
</script>
