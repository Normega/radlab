# The repo's first CI workflow (2026-07-30). Deliberately small.
#
# It runs the test suite and the production build on every push to main and
# every PR. The suite's newest member is supabase/functions/verifyJwtConfig
# .test.mjs, which is the reason this file exists: config.toml pins each Edge
# Function's verify_jwt, but nothing stopped someone adding a function and
# forgetting the entry — which deploys it JWT-required and silently breaks its
# caller. That check now fails the build instead.
#
# `npm run lint` IS here as of 2026-07-31, as an errors-only gate.
#
# It was left out originally on the reasoning that a lint which is red on
# arrival gets ignored, which is worse than no CI — correct, and the reason the
# backlog got cleared before wiring it in. (The original note estimated ~6,000
# pre-existing errors; the real figure was 246 problems / 205 errors on the
# config as it then stood. The argument held either way.)
#
# That backlog is now 0 errors / ~129 warnings. The remaining warnings are
# almost entirely eslint-plugin-react-hooks v7's React Compiler diagnostics,
# deliberately set to warn in eslint.config.js because we do not run the
# compiler — see the comment block there for the full reasoning.
#
# `eslint` exits non-zero on errors only, so warnings do not fail this job.
# That is the point: at 0 errors, a red lint means someone just introduced a
# real problem, rather than adding to a pile nobody reads. Do NOT add
# --max-warnings 0 until the compiler-diagnostic backlog is actually worked
# through, or this returns to being red-on-arrival and ignored.
#
# Node 22 is required, not just convenient: the test script uses
# --experimental-strip-types so materializeSchedule.test.mjs can import the .ts
# module it exercises. That flag landed in 22.6.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint (errors fail the build; warnings do not)
        run: npm run lint

      - name: Tests
        run: npm test
        env:
          # Optional. When this secret exists, verifyJwtConfig additionally
          # compares config.toml against what is actually deployed and fails on
          # drift. Absent, that one check skips and the offline checks still
          # run — so CI is useful with or without it.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Production build
        run: npm run build
